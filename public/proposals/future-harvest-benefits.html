<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>团体医疗保障范围 | 新加坡小圆姐</title>
<!--
  企业团体医疗（AIA Flexi Vital Care Plus）保障范围页，版式同 sheng-yin-family-protection.html。
  样式、交互是明文；页面内容（公司名、人数、保费、保障明细）用访问密码加密后放在 <script id="enc">，
  输对密码才在浏览器里解开。资料格式：{"html": "<整页正文>"}。
  改资料：PW='访问密码' node scripts/policy-summary-crypt.mjs decrypt 本页 > 资料.json → 改 json → encrypt 回本页。
  访问密码不写进仓库，见 CLAUDE.md。
-->
<style>
/* singaporeyuan.com 报价版式：象牙纸色 + 海军蓝 + 金 */
:root{
  --paper:#FBF6EA; --card:#FFFDF8;
  --navy:#13286B; --navy-2:#1C3A8F;
  --gold:#B8862B; --gold-deep:#9A6B17; --gold-light:#C9973A;
  --gold-tint:#F5EAD2; --gold-tint-2:#FAF2E1; --blue-tint:#EEF3FB;
  --green:#1E4D3B; --green-tint:#E7F0EA;
  --red:#B4433A; --red-tint:#FBEAE6;
  --line:#EADFC8; --ink:#2B2B2B; --muted:#6B6458;
  --shadow:0 1px 6px rgba(120,90,30,.06);
  --font:"Helvetica Neue","Avenir Next",Arial,"Hiragino Sans GB","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.page{position:relative;max-width:1000px;margin:0 auto;padding:36px 28px;overflow:hidden}
.deco{position:absolute;top:0;right:0;width:170px;height:124px;pointer-events:none}
.ic{width:16px;height:16px;color:var(--gold);flex:0 0 auto}
[hidden]{display:none!important}

/* 密码门 */
body.locked{overflow:hidden}
body.locked>*:not(#pwGate):not(svg){visibility:hidden}
#pwGate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:var(--paper);padding:20px}
body.locked #pwGate{display:flex}
.pw-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;box-shadow:0 20px 60px -30px rgba(19,40,107,.35)}
.pw-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--gold-tint-2);border-radius:999px;padding:4px 14px 4px 4px;font-size:12.5px;font-weight:700;color:var(--gold-deep)}
.pw-chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.pw-card h2{margin-top:18px;font-size:24px;font-weight:800;color:var(--navy)}
.pw-card p{margin-top:6px;font-size:14px;color:var(--muted)}
#pwInput{margin-top:20px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 16px;font-size:16px;outline:none}
#pwInput:focus{border-color:var(--gold)}
#pwSubmit{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#pwSubmit:disabled{opacity:.7;cursor:wait}
.pw-err{display:none;margin-top:10px;font-size:13px;color:var(--red);font-weight:600}
.pw-err.show{display:block}

/* 标题 */
.hero{position:relative;z-index:1}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold-deep);margin-bottom:6px}
.hero h1{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.2px;color:var(--navy);text-wrap:balance}
.hero h1 .l2{display:block;color:var(--gold);font-size:.78em;margin-top:2px}
.meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
.meta span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink)}
.meta span.who{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.meta span.who .ic{color:#fff}
.meta .ic{width:14px;height:14px}
.tools{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--gold);color:var(--gold-deep)}
.btn .ic{width:15px;height:15px}

/* 小节 */
.sub-head{display:flex;align-items:center;gap:9px;margin:38px 0 12px;font-size:17px;font-weight:800;color:var(--navy)}
.sub-head::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.4}
.sub-head .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;flex:0 0 auto}
.sec-sub{margin:-4px 0 12px;font-size:12.5px;color:var(--muted)}
.sec-sub b{color:var(--navy)}
.fine{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.7}

/* 受保人员 */
.ppl{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);border-left:5px solid var(--navy)}
.grp.g{border-left-color:var(--gold)}
.grp h4{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:800;color:var(--navy)}
.grp h4 b{font-size:22px;line-height:1}
.grp.g h4 b{color:var(--gold-deep)}
.grp h4 small{font-size:12px;font-weight:600;color:var(--muted)}
.bands{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.bands span{font-size:12px;font-weight:700;color:var(--navy);background:var(--blue-tint);border-radius:999px;padding:2px 10px}
.grp.g .bands span{background:var(--gold-tint-2);color:var(--gold-deep)}

/* 三项保障概览 */
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ovc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.ovc .hd{display:flex;align-items:center;gap:10px}
.ovc .hd .bubble{width:40px;height:40px;border-radius:12px;background:var(--gold-tint);display:grid;place-items:center;flex:0 0 auto}
.ovc .hd .bubble .ic{width:24px;height:24px;color:var(--gold-deep)}
.ovc .hd b{font-size:15px;font-weight:800;color:var(--navy);line-height:1.3}
.ovc .hd small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.ovc .big{margin-top:4px;font-size:19px;font-weight:800;color:var(--navy);line-height:1.35}
.ovc ul{list-style:none;display:grid;gap:3px;font-size:12.5px}
.ovc li{position:relative;padding-left:12px}
.ovc li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.ovc a{margin-top:auto;padding-top:6px;font-size:12.5px;font-weight:700;color:var(--gold-deep);text-decoration:none}
.ovc a:hover{text-decoration:underline}

/* 保费 */
.tbl{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:var(--gold-tint-2);font-size:12px;color:var(--muted);font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl td:first-child{font-weight:700;color:var(--navy)}
.tbl tr.sum td{background:var(--navy);color:#fff;font-weight:800;border-bottom:0}
.tbl tr.sum td:last-child{color:var(--gold-light);font-size:16px}
.tbl tbody tr:last-child td{border-bottom:0}
.monthly{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.monthly b{color:var(--navy)}

/* 看病场景（可点） */
.scn{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.scn-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--gold-tint-2);border-bottom:1px solid var(--line)}
.scn-tabs button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
.scn-tabs button .ic{width:16px;height:16px}
.scn-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.scn-tabs button.on .ic{color:var(--gold-light)}
.scn-tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scn-p{padding:18px 20px 20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scn-p h4{font-size:16px;font-weight:800;color:var(--navy)}
.scn-p h4 small{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:6px}
.steps{list-style:none;margin-top:12px;display:grid;gap:10px;counter-reset:s}
.steps li{position:relative;padding-left:36px;font-size:13.5px;line-height:1.65}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold-tint);color:var(--gold-deep);font-size:12px;font-weight:800;display:grid;place-items:center}
.steps b{color:var(--navy)}
.pay{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:0 8px;line-height:1.7;margin-right:4px;vertical-align:1px}
.pay.free{background:var(--green-tint);color:var(--green)}
.pay.reim{background:var(--blue-tint);color:var(--navy-2)}
.tip{margin-top:12px;font-size:12.5px;background:var(--gold-tint-2);border-radius:10px;padding:8px 12px;color:var(--ink)}
.tip b{color:var(--gold-deep)}

/* 保障明细行 */
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.blk+.blk{margin-top:12px}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;background:var(--gold-tint-2);border-bottom:1px solid var(--line)}
.blk-h b{font-size:14px;font-weight:800;color:var(--navy)}
.blk-h small{font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,38%);gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .k{font-size:13.5px;font-weight:700;color:var(--ink)}
.row .k small{display:block;font-size:12px;font-weight:500;color:var(--muted);line-height:1.55;margin-top:1px}
.row .v{text-align:right;font-size:14px;font-weight:800;color:var(--navy)}
.row .v small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.row .v.g{color:var(--gold-deep)}
/* 共用额度：左侧金色括线 + 右侧合并额度 */
.pool{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,38%);border-bottom:1px solid var(--line)}
.pool .items{border-right:3px solid var(--gold);margin:8px 0}
.pool .items .row{border-bottom:1px dashed var(--line);padding-right:12px}
.pool .items .row:last-child{border-bottom:0}
.pool .items .row{grid-template-columns:1fr}
.pool .amt{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:10px 16px;text-align:right;background:linear-gradient(90deg,var(--gold-tint-2),transparent)}
.pool .amt b{font-size:22px;font-weight:800;color:var(--gold-deep);line-height:1.2}
.pool .amt span{font-size:12px;font-weight:700;color:var(--navy)}
.pool .amt small{font-size:11.5px;color:var(--muted);margin-top:2px}

/* EMM 示意 */
.emm{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.emm h4{font-size:14px;font-weight:800;color:var(--navy)}
.emm h4 small{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.trig{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.trig span{background:var(--blue-tint);color:var(--navy);font-weight:700;border-radius:999px;padding:3px 12px}
.trig i{font-style:normal;color:var(--muted);font-weight:700}
.layers{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.layers>div{padding:12px 14px;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.layers .l1{background:var(--navy);color:#fff}
.layers .l2{background:repeating-linear-gradient(135deg,var(--gold-tint) 0 10px,var(--gold-tint-2) 10px 20px)}
.layers small{font-size:11.5px;font-weight:700;opacity:.8}
.layers b{font-size:17px;font-weight:800;line-height:1.35}
.layers .l2 b{color:var(--gold-deep)}
.layers .l2 em{font-style:normal;font-size:12px;color:var(--ink)}
.arrow{font-size:12px;color:var(--muted);margin-top:8px}

/* 两个 2,000 额度 */
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.twin .blk{margin-top:0}
.twin .blk+.blk{margin-top:0}
.cap{display:flex;align-items:baseline;gap:6px;padding:12px 16px 4px}
.cap b{font-size:26px;font-weight:800;color:var(--gold-deep);line-height:1}
.cap span{font-size:12.5px;font-weight:700;color:var(--navy)}
.ref{margin-top:12px;display:flex;align-items:flex-start;gap:8px;font-size:12.5px;background:var(--blue-tint);border-radius:10px;padding:9px 12px;color:var(--navy)}
.ref .ic{color:var(--navy-2);margin-top:2px}

/* 牙科定额表 */
details.sched{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.sched summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:13.5px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sched summary::-webkit-details-marker{display:none}
details.sched summary::after{content:"展开 ▾";font-size:12px;color:var(--gold-deep);font-weight:700;flex:0 0 auto}
details.sched[open] summary::after{content:"收起 ▴"}
.dg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;padding:0 16px 14px}
.dg section h5{font-size:12px;font-weight:800;color:var(--gold-deep);margin:12px 0 4px;letter-spacing:.04em}
.dg dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:12.5px}
.dg dt{color:var(--ink)}
.dg dd{text-align:right;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}

/* 员工 vs 家属 */
.cmp{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.cmp-r{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.cmp-r:last-child{border-bottom:0}
.cmp-r>div{padding:10px 14px;font-size:13px;line-height:1.6}
.cmp-r>div+div{border-left:1px solid var(--line)}
.cmp-r .k{font-weight:800;color:var(--navy)}
.cmp-r.h>div{background:var(--gold-tint-2);font-size:12.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px}
.cmp-r.h .g{color:var(--gold-deep)}
.cmp-r .same{color:var(--green);font-weight:700}
.cmp-r .lab{display:none}

/* 提醒 */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.al{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px}
.al .ic{width:22px;height:22px;margin-top:1px}
.al b{display:block;font-size:14px;font-weight:800;color:var(--navy);line-height:1.4}
.al p{margin-top:3px;font-size:12.5px;line-height:1.65}
.al p b,.al.red p b{display:inline;font-size:inherit;line-height:inherit}
.al.red{grid-column:1/-1;background:var(--red-tint);border-color:#F2C2B5}
.al.red .ic{color:var(--red)}
.al.red b{color:var(--red);font-size:15px}

/* 附带服务 */
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.perk b{display:block;font-size:13.5px;font-weight:800;color:var(--navy)}
.perk p{margin-top:3px;font-size:12px;color:var(--ink);line-height:1.6}

/* 顾问 */
.cta{margin-top:38px;background:var(--navy);border-radius:18px;padding:22px 24px;color:#fff;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(201,151,58,.35);pointer-events:none}
.cta h3{position:relative;z-index:1;font-size:20px;font-weight:800;line-height:1.35}
.cta h3 span{color:var(--gold-light)}
.adv{position:relative;z-index:1;margin-top:14px;max-width:560px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.adv .top{display:flex;align-items:center;gap:11px}
.adv .top img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold-light);background:#fff;flex:0 0 auto}
.adv .top b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.adv .top b span{font-size:13px;font-weight:600;color:rgba(255,255,255,.75);margin-left:4px}
.adv .top small{display:block;font-size:12px;color:var(--gold-light);font-weight:700}
.adv .rn{margin-top:6px;font-size:11.5px;color:rgba(255,255,255,.7)}
.adv .lines{margin-top:8px;display:grid;gap:5px}
.adv .lines>*{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#fff;text-decoration:none;background:none;border:0;padding:0;text-align:left;min-width:0}
.adv .lines .ic{width:15px;height:15px;color:var(--gold-light)}
.adv .lines .cp{cursor:pointer;background:var(--gold);border-radius:999px;padding:5px 12px;font-weight:700;width:max-content;max-width:100%}
.adv .lines .cp .ic{color:#fff}
.adv .lines .cp:hover{background:var(--gold-deep)}
.adv .lines .t{overflow-wrap:anywhere}
.adv .qr{background:#fff;border-radius:12px;padding:7px 7px 5px;text-align:center}
.adv .qr img{display:block;width:96px;height:96px;object-fit:contain}
.adv .qr span{display:block;margin-top:2px;font-size:11px;font-weight:700;color:var(--navy)}

.notes{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.75}
.notes p{margin-bottom:4px;padding-left:12px;position:relative}
.notes p::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.notes b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

@media (max-width:760px){
  .page{padding:24px 16px}
  .hero h1{font-size:25px}
  .ppl,.ov,.twin,.alerts{grid-template-columns:1fr}
  .perks{grid-template-columns:1fr 1fr}
  .row,.pool{grid-template-columns:minmax(0,1fr) minmax(96px,40%)}
  .dg{grid-template-columns:1fr}
  .layers{grid-template-columns:1fr}
  .layers>div{min-height:0}
  .tbl th,.tbl td{padding:9px 10px;font-size:12.5px}
  .cmp-r{grid-template-columns:1fr 1fr}
  .cmp-r .k{grid-column:1/-1;background:var(--gold-tint-2);border-bottom:1px solid var(--line)}
  .cmp-r>div+div{border-left:0}

}
@media (max-width:420px){
  .perks{grid-template-columns:1fr}

}

  @page{size:A4 portrait;margin:10mm}

  .blk,.al,.ovc,.emm,.cmp-r,.perk{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* 正文解开后接上交互：看病场景切换、复制微信号、打印 */
function wire(){
  const R = $("report");
  R.addEventListener("click", e => {
    const tab = e.target.closest("[data-sc]");
    if (tab){
      R.querySelectorAll("[data-sc]").forEach(b => { const on = b === tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
      R.querySelectorAll("[data-sp]").forEach(p => { p.hidden = p.dataset.sp !== tab.dataset.sc; });
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp){
      const v = cp.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(
        () => toast("已复制微信号 " + v), () => toast("微信号：" + v));
      return;
    }
    if (e.target.closest("[data-print]")) window.print();
  });
}
/* 打印时把牙科定额表也展开 */
window.addEventListener("beforeprint", () => document.querySelectorAll("details.sched").forEach(d => { d.dataset.wasOpen = d.open; d.open = true; }));
window.addEventListener("afterprint", () => document.querySelectorAll("details.sched").forEach(d => { d.open = d.dataset.wasOpen === "true"; }));

/* ============ 密码门：输对密码才解得开资料（PBKDF2 + AES-GCM） ============ */
(function(){
  const KEY='sy_policy_key:'+location.pathname;
  const E=JSON.parse($('enc').textContent);
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64=u=>btoa(String.fromCharCode.apply(null,new Uint8Array(u)));
  const subtle=window.crypto&&crypto.subtle;
  const form=$('pwForm'), inp=$('pwInput'), btn=$('pwSubmit'), err=$('pwErr');

  function render(D){ $('report').innerHTML=D.html; wire(); }
  async function derive(pw){
    const base=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return subtle.deriveKey({name:'PBKDF2',salt:unb64(E.salt),iterations:E.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function unlock(key){
    const pt=await subtle.decrypt({name:'AES-GCM',iv:unb64(E.iv)},key,unb64(E.ct));
    render(JSON.parse(new TextDecoder().decode(pt)));
    document.body.classList.remove('locked');
  }

  /* 同一会话里刷新不用再输 */
  try{
    const raw=sessionStorage.getItem(KEY);
    if(raw&&subtle) subtle.importKey('raw',unb64(raw),'AES-GCM',false,['decrypt']).then(unlock).catch(()=>sessionStorage.removeItem(KEY));
  }catch(e){}

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(!subtle){err.textContent='这个浏览器打不开加密资料，请换 Safari 或 Chrome 再试。';err.classList.add('show');return;}
    btn.disabled=true;btn.textContent='正在打开…';err.classList.remove('show');
    try{
      const key=await derive(inp.value.trim());
      await unlock(key);
      try{sessionStorage.setItem(KEY,b64(await subtle.exportKey('raw',key)));}catch(_){}
      window.scrollTo(0,0);
    }catch(_){
      err.classList.add('show');inp.select();
    }finally{btn.disabled=false;btn.textContent='查看方案';}
  });
})();
</script>
