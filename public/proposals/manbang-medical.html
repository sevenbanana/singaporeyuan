<title>员工医疗福利建议书 · 加密文档</title>
<style>
  :root{--navy:#123154;--navy-2:#244a72;--gold:#c6a15b;--muted:#6d7b8a;--line:#dce3ea}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 100%);padding:24px;
  }
  .card{
    background:#fff;border-radius:14px;padding:44px 36px;max-width:400px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center;
  }
  .badge{
    display:inline-block;font-size:11px;letter-spacing:.22em;color:var(--gold);
    border:1px solid var(--gold);border-radius:999px;padding:5px 14px;margin-bottom:22px;
  }
  h1{font-size:19px;color:var(--navy);line-height:1.5;margin-bottom:8px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:28px}
  input{
    width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:9px;outline:none;text-align:center;letter-spacing:.08em;
  }
  input:focus{border-color:var(--navy-2)}
  button{
    width:100%;margin-top:14px;padding:13px;font-size:15px;font-weight:600;color:#fff;
    background:var(--navy);border:none;border-radius:9px;cursor:pointer;
  }
  button:hover{background:var(--navy-2)}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:14px;font-size:13px;color:#b4433a;min-height:18px}
  .foot{margin-top:26px;font-size:11px;color:var(--muted)}
</style>
</head>
