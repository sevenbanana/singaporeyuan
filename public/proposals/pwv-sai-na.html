<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PWV 方案 | 新加坡小圆姐</title>
<!--
  PWV 方案图（版式同 pwv-jack-2pay.html / pwv-plan-builder.html 的方案图）。
  样式和框架是明文；方案内容（客户姓名、保费、各方案方案图）用访问密码加密后放在 <script id="enc">，
  输对密码才在浏览器里解开。资料格式：{"html": "<各方案方案图>"}，每张方案图是 .fit[data-k] 包着的 .sheet。
  改资料：PW='访问密码' node scripts/policy-summary-crypt.mjs decrypt 本页 > 资料.json → 改 json → encrypt 回本页。
  访问密码不写进仓库，见 CLAUDE.md。
-->
<style>
:root{
  --paper:#FBF6EA; --card:#FFFDF8;
  --navy:#13286B; --navy-2:#1C3A8F;
  --gold:#B8862B; --gold-deep:#9A6B17; --gold-light:#C9973A;
  --gold-tint:#F5EAD2; --gold-tint-2:#FAF2E1;
  --line:#EADFC8; --ink:#2B2B2B; --muted:#6B6458;
  --font:"Helvetica Neue","Avenir Next",Arial,"Hiragino Sans GB","PingFang SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input{font-family:inherit}
.wrap{max-width:1184px;margin:0 auto;padding:28px 32px 40px}

/* 密码门 */
body.locked{overflow:hidden}
body.locked>*:not(#pwGate){visibility:hidden}
#pwGate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:var(--paper);padding:20px}
body.locked #pwGate{display:flex}
.pw-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;box-shadow:0 20px 60px -30px rgba(19,40,107,.35)}
.pw-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--gold-tint-2);border-radius:999px;padding:4px 14px 4px 4px;font-size:12.5px;font-weight:700;color:var(--gold-deep)}
.pw-chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.pw-card h2{margin-top:18px;font-size:24px;font-weight:800;color:var(--navy)}
.pw-card p{margin-top:6px;font-size:14px;color:var(--muted)}
#pwInput{margin-top:20px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 16px;font-size:15px;outline:none}
#pwInput:focus{border-color:var(--gold)}
#pwSubmit{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#pwSubmit:disabled{opacity:.7;cursor:wait}
.pw-err{display:none;margin-top:10px;font-size:13px;color:#B4433A;font-weight:600}
.pw-err.show{display:block}

/* 工具条：选方案 + 下载 */
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-bottom:18px}
.bar .l,.bar .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold-deep)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

/* 方案图 */
.fit{position:relative;overflow:hidden}
.sheet{width:1120px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 40px 28px;position:relative;overflow:hidden;transform-origin:top left;box-shadow:0 10px 40px -24px rgba(19,40,107,.3)}
.sheet.t2{--navy:#1E4D3B;--navy-2:#2A6450}   /* 2 Pay 用墨绿主色，5 Pay 保持海军蓝 */
.sheet .deco{position:absolute;top:0;right:0;width:170px;height:120px}
.s-head{display:flex;align-items:flex-end;gap:28px}
.tag{flex:0 0 auto;background:var(--navy);color:#fff;padding:34px 22px 18px;border-radius:0 0 12px 12px;font-size:22px;font-weight:800;line-height:1.3}
.tag i{display:block;font-style:normal;color:var(--gold-light);font-size:18px}
.s-title{padding-bottom:6px;position:relative;z-index:1}
.s-title h2{font-size:34px;line-height:1.15;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.s-title h2 span{color:var(--gold)}
.s-title .prod{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.6}
.s-intro{margin-top:22px;font-size:19px;font-weight:600}
.s-intro p+p{margin-top:2px;font-size:16px;font-weight:500}
.s-intro b{color:var(--navy)}
.strip{margin-top:18px;display:grid;grid-template-columns:1fr 1.25fr;background:var(--gold-tint);border:1px solid var(--line);border-radius:12px;padding:16px 24px}
.strip>div{font-size:14.5px;line-height:1.85}
.strip>div+div{border-left:1px solid #DCC9A2;padding-left:24px;margin-left:24px}
.strip .g{color:var(--gold-deep);font-weight:800}
.strip .h{font-weight:800;color:var(--navy)}
.strip .c{color:var(--navy);font-weight:800}
.strip .hl{display:inline-block;margin:3px 0 2px;background:#FBE3DC;color:#B03A2E;border:1px solid #F2C2B5;border-radius:999px;padding:1px 12px 1px 10px;font-weight:600}
.strip .hl b{font-weight:800}

.tl{position:relative;margin-top:30px}
.tl.has-gift{margin-top:58px}
.tl .axis{position:absolute;left:0;top:47px;height:2px;background:linear-gradient(90deg,#E2D3B3,#D9C59C)}
.cols{position:relative;display:grid;grid-template-columns:2.3fr repeat(4,1fr);gap:14px}
.col{display:flex;flex-direction:column;align-items:center;text-align:center}
.topv{height:36px;font-size:20px;font-weight:800;color:var(--gold-deep);white-space:nowrap;display:flex;align-items:flex-end}
.dotrow{height:24px;display:flex;align-items:center;justify-content:center}
.dot{width:20px;height:20px;border-radius:50%;background:var(--gold-tint);border:3px solid var(--card);box-shadow:0 0 0 1px #D9C59C}
.dot.on{background:var(--gold)}
.dotrow .heart{width:26px;height:26px;background:var(--paper);border-radius:50%;padding:1px}
.age{font-size:28px;font-weight:800;color:var(--navy);line-height:1.25}
.agesub{font-size:13px;font-weight:700;min-height:20px}
.box{width:100%;border-radius:10px;padding:9px 6px;margin-top:8px}
.box span{display:block;font-size:13px;color:var(--muted)}
.box b{display:block;font-size:19px;font-weight:800;color:var(--navy)}
.box.line{border:1.5px solid #D9C59C;background:var(--card)}
.box.fill{background:var(--gold-tint);border:1px solid #E3CFA4}
.box.fill b{color:var(--gold-deep)}
.box.fill small{font-size:12px;color:var(--muted);font-weight:600}
.box.death{border:1.5px dashed #D9C59C;background:transparent;padding:9px 4px}
.box.death b{font-size:15px;line-height:1.45}
.box.death .nw{display:inline;white-space:nowrap;font-size:13.5px;color:var(--navy)}
.cap{margin-top:6px;font-size:12.5px;color:var(--muted)}
.cap.as{color:var(--gold-deep);font-weight:600}

.early{position:relative;align-items:stretch}
.ticks{position:relative;height:118px}
.tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tick .tv{height:36px;display:flex;align-items:flex-end;font-size:15px;font-weight:800;color:var(--gold-deep)}
.tick .gift{position:absolute;bottom:100%;margin-bottom:-4px;white-space:nowrap;background:#FBE3DC;color:#B03A2E;border:1px solid #F2C2B5;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.tick .gift::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border-top:6px solid #F2C2B5;border-left:5px solid transparent;border-right:5px solid transparent}
.tl.has-gift .ticks .tick:first-child .tv{color:#B03A2E;font-size:17px}
.coin{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#D8AC52,#A9781F);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--paper)}
.assume{position:absolute;right:0;top:122px;font-size:13px;font-weight:700;text-align:right;line-height:1.5}
.divbox{margin-top:auto;background:var(--gold-tint);border:1px solid #E3CFA4;border-radius:12px;padding:12px 14px}
.divbox h4{font-size:16px;font-weight:800;color:var(--navy);text-align:center}
.divbox .yrs{display:flex;justify-content:space-around;margin-top:6px;gap:6px}
.divbox .yrs div{text-align:center}
.divbox .yrs span{display:block;font-size:12.5px;color:var(--muted)}
.divbox .yrs b{display:block;font-size:15px;font-weight:800;color:var(--navy)}
.divbox .yrs .last b{color:var(--gold-deep)}

/* 先增值后分红：顶部两段色带 */
.tl.growth{padding-top:50px}
.tl.growth.has-gift{padding-top:74px;margin-top:20px}
.tl.growth .axis{top:97px}
.tl.growth.has-gift .axis{top:121px}
.band{position:absolute;left:0;right:0;top:0;height:40px;display:grid;column-gap:10px}
.band>div{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;color:#fff;font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden}
.band .b1{background:var(--gold)}
.band .b2{background:var(--navy)}
.band svg{width:20px;height:20px;flex:0 0 auto}
.band small{font-size:12.5px;font-weight:600;opacity:.85}

/* 4% 小表 + 0% 小字 */
.rates{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px 10px}
.rates h4{font-size:13.5px;font-weight:800;color:var(--navy)}
.rates h4 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.rt{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.rt th,.rt td{padding:5px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.rt th{font-size:11.5px;font-weight:700;color:var(--muted);vertical-align:bottom;line-height:1.35}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt tbody tr:last-child td{border-bottom:0}
.rt td:first-child{font-weight:800;color:var(--navy)}
.rates .ref{margin-top:6px;font-size:11.5px;color:var(--muted)}

.s-foot{display:grid;grid-template-columns:2.3fr 4fr;gap:14px;align-items:end;margin-top:18px}
.maker{display:flex;gap:12px;align-items:center}
.maker img{width:84px;height:84px;border-radius:8px;background:#fff;padding:4px;border:1px solid var(--line)}
.maker p{font-size:13px;line-height:1.7}
.maker p b{color:var(--navy)}
.flex{border:1.5px solid #D9C59C;background:var(--card);border-radius:12px;padding:12px 20px;display:flex;justify-content:space-between;gap:16px;font-size:14.5px;font-weight:600;color:var(--navy)}
.flex span{color:var(--muted);font-weight:500}
.notes{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.65;list-style:none}
.notes li{position:relative;padding-left:10px}
.notes li::before{content:"*";position:absolute;left:0}

.legal{max-width:1120px;margin:22px auto 0;font-size:12px;color:#7a7264;line-height:1.7}
[hidden]{display:none!important}
@media (max-width:760px){ .wrap{padding:20px 16px} .bar{justify-content:flex-start} }
@media print{
  @page{size:A4 portrait;margin:8mm}
  body{background:#fff}
  .bar,.toast,.legal{display:none!important}
  .wrap{padding:0;max-width:none}
  .fit,.fit[hidden]{display:block!important;height:auto!important;overflow:visible;break-after:page}
  .fit:last-child{break-after:auto}
  .sheet{transform:none!important;zoom:.66;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body class="locked">

<div id="pwGate">
  <form class="pw-card" id="pwForm">
    <span class="pw-chip"><img src="/avatar-round.png" alt=""><span>新加坡小圆姐 · 专属方案</span></span>

    <p>为保护客户资料，请输入访问密码。</p>

</div>

<section class="wrap">
  <div class="bar">

      </div>
    </div>
    <div class="r">
      <button class="btn pri" id="bPng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>下载这张图</button>
      <button class="btn" id="bPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>导出 PDF（4 张）</button>

</section>

<script>
const $ = id => document.getElementById(id);
let M = "d", T = "5";

/* 只显示选中的方案图；时间轴横线画到最后一列圆点，先增值的色带按「转分红」那一列分段；按屏幕宽度缩放 */
function layout(){
  document.querySelectorAll("#report .fit").forEach(fit => {
    fit.hidden = fit.dataset.k !== M + T;
    if (fit.hidden) return;
    const sh = fit.querySelector(".sheet");
    sh.style.transform = "";
    const cols = sh.querySelector(".cols"), last = cols.lastElementChild;
    sh.querySelector(".axis").style.width = (last.offsetLeft + last.offsetWidth / 2) + "px";
    const sw = cols.querySelector("[data-switch]"), band = sh.querySelector(".band");
    if (sw && band) band.style.gridTemplateColumns = `${sw.offsetLeft - 7}px 1fr`;
    const s = Math.min(1, fit.clientWidth / sh.offsetWidth);
    sh.style.transform = s < 1 ? `scale(${s})` : "";
    fit.style.height = (sh.offsetHeight * s) + "px";
  });
}
function seg(id, attr, set){
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle("on", x === b));
    set(b.dataset[attr]); layout();
  });
}
seg("segM", "m", v => M = v);
seg("segT", "t", v => T = v);
window.addEventListener("resize", layout);
/* 打印前把四张都摊开、取消缩放；打印完恢复 */
window.addEventListener("beforeprint", () => document.querySelectorAll("#report .fit").forEach(f => { f.hidden = false; }));
window.addEventListener("afterprint", layout);

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
function loadH2C(){
  return window.html2canvas ? Promise.resolve() : new Promise((ok,no)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload=ok; s.onerror=no; document.head.appendChild(s);
  });
}
$("bPng").addEventListener("click", async () => {
  const fit = document.querySelector(`#report .fit[data-k="${M+T}"]`); if (!fit) return;
  toast("正在生成图片…");
  try{
    await loadH2C();
    const canvas = await html2canvas(fit.querySelector(".sheet"), {
      scale: 2, backgroundColor: "#FBF6EA", useCORS: true,
      onclone: doc => { const s = doc.querySelector(`.fit[data-k="${M+T}"] .sheet`); s.style.transform = "none"; s.style.boxShadow = "none"; }
    });
    const a = document.createElement("a");
    a.download = `${fit.dataset.file || "PWV方案"}.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
    toast("图片已下载");
  }catch(e){ toast("图片生成失败，请改用截图或导出 PDF"); }
});
$("bPdf").addEventListener("click", () => window.print());

/* ============ 密码门：输对密码才解得开资料（PBKDF2 + AES-GCM） ============ */
(function(){
  const KEY='sy_policy_key:'+location.pathname;
  const E=JSON.parse($('enc').textContent);
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64=u=>btoa(String.fromCharCode.apply(null,new Uint8Array(u)));
  const subtle=window.crypto&&crypto.subtle;
  const form=$('pwForm'), inp=$('pwInput'), btn=$('pwSubmit'), err=$('pwErr');

  function render(D){ $('report').innerHTML=D.html; }
  async function derive(pw){
    const base=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return subtle.deriveKey({name:'PBKDF2',salt:unb64(E.salt),iterations:E.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function unlock(key){
    const pt=await subtle.decrypt({name:'AES-GCM',iv:unb64(E.iv)},key,unb64(E.ct));
    render(JSON.parse(new TextDecoder().decode(pt)));
    document.body.classList.remove('locked');
    layout();
  }

  /* 同一会话里刷新不用再输 */
  try{
    const raw=sessionStorage.getItem(KEY);
    if(raw&&subtle) subtle.importKey('raw',unb64(raw),'AES-GCM',false,['decrypt']).then(unlock).catch(()=>sessionStorage.removeItem(KEY));
  }catch(e){}

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(!subtle){err.textContent='这个浏览器打不开加密资料，请换 Safari 或 Chrome 再试。';err.classList.add('show');return;}
    btn.disabled=true;btn.textContent='正在打开…';err.classList.remove('show');
    try{
      const key=await derive(inp.value.trim());
      await unlock(key);
      try{sessionStorage.setItem(KEY,b64(await subtle.exportKey('raw',key)));}catch(_){}
      window.scrollTo(0,0);
    }catch(_){
      err.classList.add('show');inp.select();
    }finally{btn.disabled=false;btn.textContent='查看方案';}
  });
})();
</script>
</body>
</html>
