  <g stroke="#1B2A4A" stroke-opacity="0.10" stroke-width="2">
    <line x1="0" y1="780" x2="1600" y2="780"/>
  </g>
  <g fill="#1B2A4A" fill-opacity="0.06">
    <rect x="980" y="640" width="44" height="140"/>
    <rect x="1040" y="600" width="56" height="180"/>
    <rect x="1112" y="670" width="40" height="110"/>
    <rect x="1168" y="560" width="64" height="220"/>
    <rect x="1248" y="660" width="48" height="120"/>
    <rect x="1312" y="700" width="40" height="80"/>
