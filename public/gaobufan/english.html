    /* ==================================================================
       🔍 语音诊断 —— 让设备自己报告它到底有什么声音
       iOS 上「增强语音」不一定会变成独立条目，可能是同名声音悄悄换了高质量数据。
       所以这里同时给「名字列表」和「逐个试听」，按名字看不出来就用耳朵分辨。
       ================================================================== */
    voiceDiag: function () {
      var all = (global.speechSynthesis && speechSynthesis.getVoices()) || [];
      // 好的排前面、玩具音沉底，方便在 iPad 上从上往下挨个试听
      var en = all.filter(function (v) { return /^en/i.test(v.lang); })
                  .sort(function (a, b) { return TTS.score(b) - TTS.score(a); });

      var rows = en.map(function (v, i) {
        var s = TTS.score(v);
        var mine = TTS.voice && TTS.voice.name === v.name;
        return '<div class="vd-row' + (mine ? ' now' : '') + (s <= -1000 ? ' junk' : '') + '">' +
          '<button class="btn sm" data-say="' + esc(v.name) + '">🔊</button>' +
          '<div class="grow"><div class="vd-n">' + esc(v.name) + (mine ? ' ← 现在用的' : '') + '</div>' +
          '<div class="vd-m">' + esc(v.lang) + ' · ' + (v.localService ? '本地' : '云端') +
          ' · 评分 ' + s + (s <= -1000 ? '（玩具音，已排除）' : '') + '</div></div>' +
        '</div>';
      }).join('') || '<div class="muted">这台设备一个英语语音都没报告出来</div>';

      var plain = '设备: ' + navigator.userAgent + '\n' +
                  '语音总数: ' + all.length + ' / 英语 ' + en.length + '\n' +
                  '当前使用: ' + (TTS.voice ? TTS.voice.name + ' [' + TTS.voice.lang + ']' : '无') + '\n\n' +
                  en.map(function (v) {
                    return v.name + ' [' + v.lang + '] ' + (v.localService ? '本地' : '云端') + ' 评分' + TTS.score(v);
                  }).join('\n');

      var o = UI.overlay(
        '<div class="px tiny">这台设备报告的英语语音（共 ' + en.length + ' 个）</div>' +
        '<div class="vd-tip">挨个点 🔊 听一遍，<b>按耳朵挑，别按名字挑</b> —— ' +
          'iOS 上增强语音可能不改名字，只是同一个名字下换成了高质量数据。</div>' +
        '<div class="vd-list scroll">' + rows + '</div>' +
        '<textarea class="ta" id="vddump" readonly>' + esc(plain) + '</textarea>' +
        '<div class="row center wrap" style="margin-top:12px">' +
          '<button class="btn sm" id="vdcopy">📋 复制这份清单</button>' +
          '<button class="btn ghost" data-close>关闭</button></div>');

      o.querySelectorAll('[data-say]').forEach(function (b) {
        b.onclick = function () {
          var v = en.filter(function (x) { return x.name === b.dataset.say; })[0];
          if (!v) return;
          var keep = TTS.voice;
          TTS.voice = v;
          TTS.speak('Good morning, Bufan. Time to wake up!', { rate: 0.9 });
          setTimeout(function () { TTS.voice = keep; }, 2600);
        };
      });
      o.querySelector('#vdcopy').onclick = function () {
        var t = o.querySelector('#vddump');
        t.select(); t.setSelectionRange(0, 99999);
        try { document.execCommand('copy'); UI.toast('📋', '已复制', '粘贴给爸爸看'); }
        catch (e) { UI.toast('📋', '复制失败', '手动选中文本框里的字'); }
      };
    },

    /* ==================================================================
       ⚙️ 设置
       ================================================================== */
    settings: function () {
      App.setHudMode('home');
      var ranked = TTS.list();
      var best = ranked[0] ? TTS.score(ranked[0]) : 0;
      var opts = ranked.map(function (v) {
        var s = TTS.score(v);
        var tag = s >= 100 ? '  ⭐ 增强' : (s >= 60 ? '  ✓ 较自然' : '');
        return '<option value="' + esc(v.name) + '"' + (TTS.voice && TTS.voice.name === v.name ? ' selected' : '') +
               '>' + esc(v.name) + ' (' + esc(v.lang) + ')' + tag + '</option>';
      }).join('');
      // 一个增强语音都没有 = 系统只装了老式 compact 引擎，机器感就是从这来的
      var noGood = best < 60;
      // 装了更好的但没用上（比如刚下完增强语音回来），主动提示换过去
      var cur = TTS.voice ? TTS.score(TTS.voice) : -1;
      var better = (!noGood && ranked[0] && cur < best) ? ranked[0] : null;

      stage.innerHTML =
        this.head('⚙️', '设置', '') +
        '<div class="scroll" style="flex:1">' +
          '<div class="panel"><div class="px tiny">发音</div>' +
            '<div class="row" style="margin-top:10px"><span class="tiny" style="color:#333;width:80px">朗读声音</span>' +
            '<select id="vsel" class="sel">' + (opts || '<option>系统没有英文语音</option>') + '</select>' +
            '<button class="btn sm" data-a="test">试听</button></div>' +
            '<div class="tiny" style="color:#555;margin-top:8px">列表已按自然度排好，⭐ 的最好听。新加坡用英式，同等自然度下优先 en-SG / en-GB。</div>' +
            (noGood
              ? '<div class="voice-warn">⚠️ 这台设备只装了<b>老式语音引擎</b>，机器感就是从这来的。<br>' +
                '<b>iPad：</b>设置 → 辅助功能 → 朗读内容 → 声音 → 英语，下载任意带<b>「增强」或「高级」</b>的声音（免费，几十 MB），回来在上面重选。<br>' +
                '<b>Mac：</b>系统设置 → 辅助功能 → 朗读内容 → 系统声音 → 管理声音，同样下载增强版。<br>' +
                '下载完回来<b>刷新一下页面</b>，新声音才会出现在上面的列表里。</div>'
              : '') +
            (better
              ? '<div class="voice-good">✨ 发现更自然的声音：<b>' + esc(better.name) + '</b>' +
                '<button class="btn sm primary" data-a="usebest">换成它</button></div>'
              : '') +
            '<div class="row wrap" style="margin-top:10px">' +
              '<button class="btn sm ghost" data-a="mute">' + (SFX.muted ? '🔇 音效已关' : '🔊 音效开着') + '</button>' +
              '<button class="btn sm ghost" data-a="diag">🔍 语音诊断</button>' +
            '</div>' +
          '</div>' +
          '<div class="panel" style="margin-top:12px"><div class="px tiny">每天学多久</div>' +
            '<div class="tiny" style="color:#555;margin:8px 0">' +
              '新词数由这个决定 —— 复习队列空的时候自动多灌，复习堆起来了自动少灌，' +
              '所以不会出现「前几天 10 分钟、一个月后一小时」。</div>' +
            '<div class="row wrap">' +
              [30, 40, 50, 60].map(function (m) {
                return '<button class="btn sm' + ((Save.data.minutes || 40) === m ? ' primary' : ' ghost') +
                       '" data-mins="' + m + '">' + m + ' 分钟</button>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div class="panel" style="margin-top:12px"><div class="px tiny">玩家</div>' +
            '<div class="tiny" style="color:#555;margin:8px 0">当前是 <b>' +
              esc((Save.PROFILES[Save.profile] || Save.PROFILES.bufan).name) + '</b>' +
              (Save.profile === 'guest' ? ' —— 访客模式，关掉就清空，什么都不会留下' : '') + '</div>' +
            '<div class="row wrap">' +
              '<button class="btn sm" data-a="switch">⇄ 换个玩家</button>' +
              (Save.profile === 'bufan' ? '<button class="btn sm ghost" data-a="pin">🔒 改密码</button>' : '') +
            '</div>' +
          '</div>' +
          '<div class="panel" style="margin-top:12px"><div class="px tiny">存档</div>' +
            '<div class="tiny" style="color:#555;margin:8px 0">进度存在这台设备的浏览器里，每个玩家一份。换设备前先导出。</div>' +
            '<div class="row wrap">' +
              '<button class="btn sm" data-a="export">📤 导出存档</button>' +
              '<button class="btn sm" data-a="import">📥 导入存档</button>' +
              '<button class="btn sm ghost" data-a="reset">🗑️ 清空重来</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="t-foot"><button class="btn ghost" data-a="back">← 回主页</button></div>';

      var sel = document.getElementById('vsel');
      if (sel) sel.onchange = function () {
        if (TTS.use(sel.value)) TTS.speak('Good morning, Bufan. Time to wake up!', { rate: 0.9 });
      };
      stage.querySelector('[data-a="test"]').onclick = function () {
        TTS.speak('Good morning, Bufan. Time to wake up!', { rate: 0.9 });
      };
      stage.querySelector('[data-a="diag"]').onclick = function () { UI.voiceDiag(); };
      var bestBtn = stage.querySelector('[data-a="usebest"]');
      if (bestBtn) bestBtn.onclick = function () {
        TTS.use(better.name); SFX.click();
        UI.settings();
        TTS.speak('Good morning, Bufan. Time to wake up!', { rate: 0.9 });
      };
      stage.querySelector('[data-a="mute"]').onclick = function (e) {
        SFX.muted = !SFX.muted; e.target.textContent = SFX.muted ? '🔇 音效已关' : '🔊 音效开着';
      };
      stage.querySelector('[data-a="export"]').onclick = function () {
        UI.overlay('<div class="px tiny">复制下面全部文字保存好</div>' +
          '<textarea class="ta" readonly>' + esc(Save.exportText()) + '</textarea>' +
          '<div class="row center" style="margin-top:12px"><button class="btn" data-close>关闭</button></div>');
      };
      stage.querySelector('[data-a="import"]').onclick = function () {
        var o = UI.overlay('<div class="px tiny">把导出的文字粘贴进来</div>' +
          '<textarea class="ta" id="imp"></textarea>' +
          '<div class="row center" style="margin-top:12px"><button class="btn primary" id="impgo">导入</button>' +
          '<button class="btn ghost" data-close>取消</button></div>');
        o.querySelector('#impgo').onclick = function () {
          try { Save.importText(o.querySelector('#imp').value.trim()); o.remove(); UI.home(); UI.toast('📥', '导入成功', '进度已恢复'); }
          catch (e) { alert('存档格式不对：' + e.message); }
        };
      };
      stage.querySelectorAll('[data-mins]').forEach(function (b) {
        b.onclick = function () {
          Save.data.minutes = +b.dataset.mins; Save.save(); SFX.click();
          UI.settings();
          UI.toast('⏱', '已改成每天 ' + b.dataset.mins + ' 分钟', '新词数会自动跟着调');
        };
      });
      stage.querySelector('[data-a="switch"]').onclick = function () { SFX.click(); App.switchProfile(); };
      var pinBtn = stage.querySelector('[data-a="pin"]');
      if (pinBtn) pinBtn.onclick = function () {
        var o = UI.overlay(
          '<div class="px tiny">改开场密码</div>' +
          '<div class="tiny muted" style="margin:10px 0">四位数字。只存在这台设备上，换设备要重新设。</div>' +
          '<input id="pin1" class="pinput" inputmode="numeric" maxlength="4" placeholder="新密码">' +
          '<input id="pin2" class="pinput" inputmode="numeric" maxlength="4" placeholder="再输一遍">' +
          '<div class="tiny" id="pinmsg" style="color:#e08a83;min-height:18px;margin-top:8px"></div>' +
          '<div class="row center" style="margin-top:12px">' +
            '<button class="btn primary" id="pingo">保存</button>' +
            '<button class="btn ghost" data-close>取消</button></div>');
        o.querySelector('#pingo').onclick = function () {
          var a = o.querySelector('#pin1').value.trim(), b = o.querySelector('#pin2').value.trim();
          var msg = o.querySelector('#pinmsg');
          if (!/^\d{4}$/.test(a)) { msg.textContent = '要四位数字'; return; }
          if (a !== b) { msg.textContent = '两次输的不一样'; return; }
          Save.setPin(a); o.remove(); UI.toast('🔒', '密码已改', '下次开场用新密码');
        };
      };
      stage.querySelector('[data-a="reset"]').onclick = function () {
        var who = (Save.PROFILES[Save.profile] || Save.PROFILES.bufan).name;
        if (confirm('确定清空 ' + who + ' 的全部学习进度？这个操作没法撤销。')) { Save.reset(); UI.home(); }
      };
      stage.querySelector('[data-a="back"]').onclick = function () { SFX.click(); UI.home(); };
    }
  };

  global.UI = UI;
})(window);

</script>
<script>
/* ===== js/app.js ===== */
/* ============================================================
   app.js — 启动、顶栏 HUD、热键栏、成就
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------------------- 成就 Advancements ---------------------- */
  var LIST = [
    { id: 'first',    ico: '🌱', t: 'Taking Inventory',   b: '完成第一节课' },
    { id: 'streak3',  ico: '🔥', t: 'Hot Streak',         b: '连续打卡 3 天' },
    { id: 'streak7',  ico: '🔥', t: 'A Week in the Mines',b: '连续打卡 7 天' },
    { id: 'streak30', ico: '💠', t: 'Diamonds!',          b: '连续打卡 30 天' },
    { id: 'perfect',  ico: '🎯', t: 'Sharpshooter',       b: '一节课全对' },
    { id: 'combo10',  ico: '⚡', t: 'On Fire',            b: '连续答对 10 题' },
    { id: 'w50',      ico: '📗', t: 'Fifty Words',        b: '掌握 50 个词' },
    { id: 'w100',     ico: '📘', t: 'Century',            b: '掌握 100 个词' },
    { id: 'w300',     ico: '📙', t: 'Three Hundred',      b: '掌握 300 个词' },
    { id: 'w500',     ico: '🏅', t: 'Halfway There',      b: '掌握 500 个词' },
    { id: 'w1000',    ico: '🐉', t: 'Free the End',       b: '掌握 1000 个词 —— 目标达成！' }
  ];

  var Ach = {
    has: function (id) { return Save.data.ach.indexOf(id) >= 0; },
    grant: function (id) {
      if (this.has(id)) return;
      var a = LIST.filter(function (x) { return x.id === id; })[0];
      if (!a) return;
      Save.data.ach.push(id); Save.save();
      UI.toast(a.ico, '达成成就！', a.t + ' — ' + a.b);
    },
    check: function (s) {
      var d = Save.data, m = SRS.masteredCount();
      this.grant('first');
      if (d.streak >= 3) this.grant('streak3');
      if (d.streak >= 7) this.grant('streak7');
      if (d.streak >= 30) this.grant('streak30');
      if (s && s.wrong === 0 && s.right > 5) this.grant('perfect');
      if (s && (s.bestCombo || 0) >= 10) this.grant('combo10');
      [[50, 'w50'], [100, 'w100'], [300, 'w300'], [500, 'w500'], [1000, 'w1000']]
        .forEach(function (p) { if (m >= p[0]) Ach.grant(p[1]); });
    }
  };

  /* ---------------------- 主控 ---------------------- */
  var App = {
    mode: 'home',

    boot: function () {
      Textures.build();
      TTS.init();
      UI.mount(document.getElementById('stage'));
      this.buildHotbar();
      this.splash();
    },

    /** 开场页：选玩家。iPad Safari 也必须靠这一次用户点击才能解锁语音 */
    splash: function () {
      var s = document.getElementById('splash');
      var pickers = document.getElementById('pickers');
      var keypad = document.getElementById('keypad');
      s.classList.remove('hide', 'gone');
      pickers.classList.remove('hide');
      keypad.classList.add('hide');
      TTS.stop();

      s.querySelectorAll('.player-card').forEach(function (b) {
        b.onclick = function () {
          SFX.unlock(); SFX.click();
          if (Save.PROFILES[b.dataset.p].locked) App.askPin(b.dataset.p);
          else App.enter(b.dataset.p);
        };
      });
    },

    /** 四位数字锁。用大按键而不是输入框 —— iPad 上不弹键盘，四下就进去了 */
    askPin: function (profile) {
      var pickers = document.getElementById('pickers');
      var keypad = document.getElementById('keypad');
      var dots = document.getElementById('kp-dots');
      var err = document.getElementById('kp-err');
      var grid = document.getElementById('kp-grid');
      var want = Save.getPin();
      var typed = '';

      pickers.classList.add('hide');
      keypad.classList.remove('hide');
      err.classList.remove('show');

      function paintDots() {
        dots.innerHTML = '';
        for (var i = 0; i < want.length; i++) {
          dots.innerHTML += '<i class="' + (i < typed.length ? 'on' : '') + '"></i>';
        }
      }

      grid.innerHTML =
        [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
          return '<button class="kp-key px" data-k="' + n + '">' + n + '</button>';
        }).join('') +
        '<button class="kp-key alt" data-k="back">←</button>' +
        '<button class="kp-key px" data-k="0">0</button>' +
        '<button class="kp-key alt" data-k="del">⌫</button>';

      grid.querySelectorAll('.kp-key').forEach(function (b) {
        b.onclick = function () {
          var k = b.dataset.k;
          SFX.click();
          if (k === 'back') { App.splash(); return; }
          if (k === 'del') { typed = typed.slice(0, -1); err.classList.remove('show'); paintDots(); return; }
          if (typed.length >= want.length) return;
          typed += k;
          paintDots();
          if (typed.length === want.length) {
            if (typed === want) { SFX.right(); App.enter(profile); }
            else {
              SFX.wrong();
              err.classList.add('show');
              keypad.classList.add('shake');
              setTimeout(function () { keypad.classList.remove('shake'); typed = ''; paintDots(); }, 420);
            }
          }
        };
      });
      paintDots();
    },

    /** 真正进入世界：读这个玩家自己的存档 */
    enter: function (profile) {
      var s = document.getElementById('splash');
      TTS.unlock(); SFX.unlock();
      Save.load(profile);
      s.classList.add('gone');
      setTimeout(function () { s.classList.add('hide'); }, 420);
      this.setHudMode('home');
      UI.home();
    },

    /** 换人：回到选玩家页，当前进度已经随时在存 */
    switchProfile: function () {
      TTS.stop();
      Game.session = null;
      this.splash();
    },

    setHudMode: function (m) {
      this.mode = m;
      document.getElementById('app').dataset.mode = m;
      document.querySelector('.hotbar').classList.toggle('hide', m !== 'session');
      this.paintHud();
    },

    startSession: function (opts) {
      Game.build(opts);
      this.setHudMode('session');
      UI.task();
    },

    advance: function () {
      TTS.stop();
      var next = Game.next();
      if (!next) { UI.home(); return; }
      UI.task();
      var st = document.getElementById('stage');
      if (st) st.scrollTop = 0;
    },

    quit: function () {
      if (!confirm('要退出这节课吗？已经答过的题会保留。')) return;
      TTS.stop(); UI.home();
    },

    buildHotbar: function () {
      var bar = document.querySelector('.hotbar');
      bar.innerHTML = Game.PHASES.map(function (p) {
        return '<div class="slot" title="' + p.name + '">' + p.ico + '</div>';
      }).join('');
    },

    paintHud: function () {
      var d = Save.data;
      var lv = Level.info(d.xp);
      var left = document.getElementById('hud-left');
      var bar = document.getElementById('xpfill');
      var txt = document.getElementById('xptext');
      var lvl = document.getElementById('xplevel');
      var hearts = document.getElementById('hearts');
      var gems = document.getElementById('gems');

      lvl.textContent = lv.level;
      gems.innerHTML = '💎 ' + d.gems;

      if (this.mode === 'session' && Game.session) {
        var p = Game.progress();
        var cur = Game.current();
        var ph = cur ? (Game.PHASES.filter(function (x) { return x.key === (cur.phase || cur.t); })[0] || {}) : {};
        bar.style.width = p.pct + '%';
        txt.textContent = (ph.name || '') + '   ' + p.i + ' / ' + p.n;
        var combo = Math.min(5, Game.session.combo || 0);
        hearts.innerHTML = [0, 1, 2, 3, 4].map(function (i) {
          return '<span class="heart' + (i < combo ? '' : ' off') + '">❤️</span>';
        }).join('');
        var sc = Game.session.scene;
        left.innerHTML = '<button class="chip" id="quitbtn">✕ 退出</button>' +
          (sc ? '<span class="chip">' + sc.icon + ' <b>' + sc.title + '</b></span>' : '<span class="chip">👹 复习日</span>');
        var qb = document.getElementById('quitbtn');
        if (qb) qb.onclick = function () { App.quit(); };

        // 热键栏状态
        var slots = document.querySelectorAll('.hotbar .slot');
        Game.phaseState().forEach(function (st, i) {
          if (!slots[i]) return;
          slots[i].classList.toggle('now', st.now);
          slots[i].classList.toggle('done', st.done);
        });
      } else {
        bar.style.width = lv.pct + '%';
        txt.textContent = lv.into + ' / ' + lv.need + ' XP';
        var st2 = Math.min(5, d.streak);
        hearts.innerHTML = [0, 1, 2, 3, 4].map(function (i) {
          return '<span class="heart' + (i < st2 ? '' : ' off') + '">🔥</span>';
        }).join('');
        var who = Save.PROFILES[Save.profile] || Save.PROFILES.bufan;
        left.innerHTML = '<button class="chip who" id="whobtn">' + who.face + ' <b>' + who.name + '</b> ⇄</button>' +
                         '<span class="chip">🔥 ' + d.streak + ' 天</span>';
        var wb = document.getElementById('whobtn');
        if (wb) wb.onclick = function () { SFX.click(); App.switchProfile(); };
      }
    }
  };

  global.App = App;
  global.Ach = Ach;

  document.addEventListener('DOMContentLoaded', function () { App.boot(); });
})(window);

</script>
</body>
</html>
