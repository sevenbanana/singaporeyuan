<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>English Quest · Bufan 的英语冒险</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1b1a">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* ===== css/mc.css ===== */
/* ============================================================
   English Quest — Minecraft UI kit
   全部视觉零外部素材：贴图由 js/textures.js 用 canvas 生成
   ============================================================ */

:root{
  --gui:        #c6c6c6;
  --gui-lit:    #ffffff;
  --gui-shade:  #545454;
  --gui-slot:   #8b8b8b;
  --gui-slot-d: #373737;

  --ink:        #ffffff;
  --ink-dim:    #a8a8a8;
  --ink-dark:   #3f3f3f;
  --shadow:     rgba(0,0,0,.55);

  --xp:         #7ffc20;
  --xp-dark:    #4a9c0f;
  --heart:      #e02f2f;
  --emerald:    #17dd62;
  --diamond:    #4aedd9;
  --gold:       #fcee4b;
  --redstone:   #ff2e2e;
  --lapis:      #3f5fc4;

  --ok:         #52d357;
  --bad:        #e35a4d;

  /* 拉丁字体必须排在 CJK 前，否则英文弯引号会被渲染成全角 */
  --f-pixel: 'Press Start 2P', 'Courier New', ui-monospace, monospace,
             'PingFang SC', 'Hiragino Sans GB', sans-serif;
  --f-read:  'Verdana', 'Trebuchet MS', 'Helvetica Neue', Arial,
             'PingFang SC', 'Hiragino Sans GB', sans-serif;
  --f-cjk:   'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; height:100%;
  overflow:hidden;
  font-family:var(--f-cjk);
  color:var(--ink);
  background:#1d1b1a;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}

img,canvas{ image-rendering:pixelated; image-rendering:crisp-edges; }

.px{ font-family:var(--f-pixel); letter-spacing:.02em; }
.sh{ text-shadow:2px 2px 0 var(--shadow); }

/* ---------- 背景：泥土墙（Minecraft 暂停界面同款） ---------- */
#bg{
  position:fixed; inset:0; z-index:0;
  background-image:var(--tex-dirt);
  background-size:64px 64px;
  filter:brightness(.42);
}
#bg::after{
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 100%);
}

/* ============================ 布局 ============================ */
#app{
  position:relative; z-index:1;
  height:100%; display:flex; flex-direction:column;
  max-width:1180px; margin:0 auto;
  padding:8px 10px 6px;
}

/* ---------- 顶栏 HUD ---------- */
.hud{
  flex:0 0 auto;
  display:flex; align-items:center; gap:10px;
  padding:4px 2px 8px;
}
.hud-left,.hud-right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.hud-mid{ flex:1 1 auto; min-width:0; }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px; font-size:11px; line-height:1;
  background:rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.18);
  white-space:nowrap;
}
.chip b{ color:var(--gold); }

/* XP 条 */
.xpwrap{ display:flex; align-items:center; gap:8px; }
.xplevel{
  font-family:var(--f-pixel); font-size:16px; color:var(--xp);
  text-shadow:2px 2px 0 #000, 0 0 6px rgba(127,252,32,.5);
  min-width:2ch; text-align:center;
}
.xpbar{
  position:relative; flex:1; height:14px;
  background:#000; border:2px solid #1c1c1c;
  box-shadow:inset 0 0 0 2px #3a3a3a;
}
.xpbar i{
  display:block; height:100%; width:0%;
  background:linear-gradient(#a8ff4e,var(--xp) 45%,var(--xp-dark));
  transition:width .35s cubic-bezier(.2,.9,.3,1);
}
.xpbar span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:9px; font-family:var(--f-pixel);
  text-shadow:1px 1px 0 #000; pointer-events:none;
}

.hearts{ display:flex; gap:2px; }
.heart{ width:18px; height:18px; font-size:15px; line-height:18px; text-align:center; filter:drop-shadow(1px 1px 0 #000); }
.heart.off{ filter:grayscale(1) brightness(.4); }

/* ---------- 舞台 ---------- */
#stage{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  position:relative;
}

/* ---------- 热键栏 ---------- */
.hotbar{
  flex:0 0 auto;
  display:flex; justify-content:center; gap:0;
  padding:8px 0 2px;
}
.slot{
  position:relative;
  width:52px; height:52px;
  background:var(--gui-slot);
  border:2px solid;
  border-color:var(--gui-shade) var(--gui-lit) var(--gui-lit) var(--gui-shade);
  display:grid; place-items:center;
  font-size:24px; line-height:1;
  filter:grayscale(1) brightness(.75);
  transition:filter .18s, transform .18s;
}
.slot.done{ filter:none; }
.slot.done::after{
  content:'✔'; position:absolute; right:1px; bottom:-1px;
  font-size:11px; color:var(--xp); text-shadow:1px 1px 0 #000;
}
.slot.now{
  filter:none; transform:translateY(-6px) scale(1.1); z-index:2;
  outline:3px solid #fff; outline-offset:-1px;
  box-shadow:0 0 0 3px rgba(0,0,0,.6), 0 0 14px rgba(255,255,255,.35);
}

/* ============================ 组件 ============================ */

/* 经典 GUI 面板 */
.panel{
  background:var(--gui);
  border:2px solid;
  border-color:var(--gui-lit) var(--gui-shade) var(--gui-shade) var(--gui-lit);
  box-shadow:0 0 0 2px #000, 0 6px 0 rgba(0,0,0,.35);
  color:var(--ink-dark);
  padding:14px;
}
.panel.dark{
  background:rgba(16,16,16,.86);
  border-color:#5a5a5a #141414 #141414 #5a5a5a;
  color:var(--ink);
}
.panel-title{
  font-family:var(--f-pixel); font-size:11px;
  color:#404040; margin:0 0 10px;
}
.panel.dark .panel-title{ color:var(--ink-dim); text-shadow:2px 2px 0 #000; }

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--f-pixel); font-size:12px; line-height:1.4;
  color:#fff; text-shadow:2px 2px 0 var(--shadow);
  background:#6f6f6f;
  border:2px solid;
  border-color:#a5a5a5 #2b2b2b #2b2b2b #a5a5a5;
  box-shadow:0 0 0 2px #000;
  padding:12px 18px; min-height:44px;
  cursor:pointer; text-align:center;
}
.btn:active{ transform:translateY(2px); border-color:#2b2b2b #a5a5a5 #a5a5a5 #2b2b2b; }
.btn:hover{ background:#7d8a7d; }
.btn.primary{ background:#3d8b40; border-color:#6fc873 #1d5220 #1d5220 #6fc873; }
.btn.primary:hover{ background:#48a44c; }
.btn.gold{ background:#a8862b; border-color:#e0bc55 #5e4a12 #5e4a12 #e0bc55; }
.btn.ghost{ background:rgba(0,0,0,.45); border-color:#777 #222 #222 #777; }
.btn.sm{ font-size:10px; padding:8px 12px; min-height:36px; }
.btn.wide{ width:100%; }
.btn[disabled]{ opacity:.45; pointer-events:none; }

/* 木牌 / 标题 */
.sign{
  display:inline-block; padding:10px 22px;
  background-image:var(--tex-plank); background-size:48px 48px;
  border:3px solid #6b4a25;
  box-shadow:0 0 0 3px #2e1e0e, 0 6px 0 rgba(0,0,0,.4);
  font-family:var(--f-pixel); font-size:14px;
  color:#fff3c4; text-shadow:2px 2px 0 #000;
}

/* 物品格（词汇 / 选项） */
.item{
  position:relative;
  background:var(--gui-slot);
  border:2px solid;
  border-color:var(--gui-shade) var(--gui-lit) var(--gui-lit) var(--gui-shade);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);
  padding:10px; cursor:pointer;
  transition:transform .12s, filter .12s;
}
.item:hover{ filter:brightness(1.18); }
.item:active{ transform:scale(.97); }
.item.ok{  background:#2f7a33; border-color:#1a4a1d #7fe084 #7fe084 #1a4a1d; }
.item.bad{ background:#8c2f28; border-color:#4d1512 #e08a83 #e08a83 #4d1512; }
.item.dim{ opacity:.35; pointer-events:none; }

/* 进度条 */
.bar{ height:10px; background:#000; border:2px solid #1c1c1c; }
.bar i{ display:block; height:100%; background:var(--xp); transition:width .3s; }

/* 成就弹窗（Advancement toast） */
#toasts{ position:fixed; top:10px; right:10px; z-index:90; display:flex; flex-direction:column; gap:8px; }
.toast{
  display:flex; align-items:center; gap:12px;
  min-width:300px; padding:12px 14px;
  background:#100e17ee;
  border:2px solid #3a3050;
  box-shadow:0 0 0 2px #000;
  animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);
}
.toast .ico{ font-size:28px; filter:drop-shadow(2px 2px 0 #000); }
.toast .tt{ font-family:var(--f-pixel); font-size:9px; color:var(--gold); margin-bottom:6px; }
.toast .tb{ font-size:13px; color:#fff; }
@keyframes toastIn{ from{ transform:translateX(120%); opacity:0 } to{ transform:none; opacity:1 } }

/* 浮层 */
.overlay{
  position:fixed; inset:0; z-index:80;
  background:rgba(0,0,0,.72);
  display:grid; place-items:center; padding:20px;
}
.overlay .panel{ max-width:640px; width:100%; max-height:88vh; overflow:auto; }

/* 滚动条 */
.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.scroll::-webkit-scrollbar{ width:10px; }
.scroll::-webkit-scrollbar-track{ background:#00000055; }
.scroll::-webkit-scrollbar-thumb{ background:var(--gui-slot); border:2px solid #000; }

/* 工具 */
.row{ display:flex; gap:10px; align-items:center; }
.col{ display:flex; flex-direction:column; gap:10px; }
.center{ justify-content:center; }
.grow{ flex:1 1 auto; min-width:0; }
.wrap{ flex-wrap:wrap; }
.hide{ display:none !important; }
.muted{ color:var(--ink-dim); }
.tiny{ font-size:11px; }

</style>
<style>
/* ===== css/quest.css ===== */
/* ============================================================
   quest.css — 各个关卡界面
   目标设备：iPad 横屏 (1180×820)，同时兼容竖屏与手机
   ============================================================ */

/* ---------------------------- 开场页 ---------------------------- */
#splash{
  position:fixed; inset:0; z-index:100;
  display:grid; place-items:center; text-align:center;
  background:#0d0c0b;
  background-image:var(--tex-stone);
  background-size:96px 96px;
  transition:opacity .4s;
}
#splash::before{ content:''; position:absolute; inset:0; background:rgba(8,8,10,.78); }
#splash.gone{ opacity:0; pointer-events:none; }
.sp-inner{ position:relative; padding:20px; }
.sp-logo{
  font-size:clamp(28px,6vw,54px); line-height:1.5; color:#fff;
  text-shadow:4px 4px 0 #2a2a2a, 0 0 24px rgba(120,220,120,.35);
  letter-spacing:.06em;
}
.sp-sub{ margin-top:18px; font-size:15px; color:var(--gold); text-shadow:2px 2px 0 #000; }
.sp-goal{ margin:22px auto 26px; max-width:520px; font-size:14px; line-height:1.9; color:#dcdcdc; }
.sp-goal b{ color:var(--xp); }
.sp-tip{ margin-top:20px; font-size:12px; color:#8b8b8b; }
.btn.big{ font-size:14px; padding:18px 34px; }

/* ---------------------------- 关卡通用头尾 ---------------------------- */
#stage{ padding:2px 2px 0; }
.t-head{
  flex:0 0 auto;
  display:flex; align-items:baseline; gap:10px;
  padding:2px 4px 10px; flex-wrap:wrap;
}
.t-ico{ font-size:22px; filter:drop-shadow(2px 2px 0 #000); }
.t-title{ font-size:13px; color:#fff; text-shadow:2px 2px 0 #000; }
.t-sub{ font-size:12px; color:#b9b9b9; }

.t-foot{
  flex:0 0 auto;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 2px 4px;
}

/* 判定反馈条 */
.fb{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:12px 14px;
  border:2px solid; box-shadow:0 0 0 2px #000;
  animation:fbIn .22s ease-out;
}
.fb.good{ background:#20431f; border-color:#4f8f4c #12290f #12290f #4f8f4c; }
.fb.bad { background:#4a1f1c; border-color:#9a4a44 #2a0f0d #2a0f0d #9a4a44; }
.fb-ico{ font-size:26px; }
.fb-t{ font-size:11px; color:#fff; text-shadow:2px 2px 0 #000; }
.fb-w{ margin-top:5px; font-size:14px; color:#e6e6e6; }
.fb-w b{ color:var(--gold); font-size:16px; }
.fb-s{ color:#bcd7bc; }
.fb-n{ margin-top:4px; font-size:12px; color:var(--gold); }
@keyframes fbIn{ from{ transform:translateY(10px); opacity:0 } to{ transform:none; opacity:1 } }

/* ============================ 主页 ============================ */
.home{ flex:1; padding:6px 4px 10px; text-align:center; }
.home-title{ margin:6px 0 18px; }
.home-sub{ margin-top:12px; font-size:13px; color:#c9c9c9; }

.quest-card{ max-width:720px; margin:0 auto; text-align:left; }
.qc-top{ display:flex; align-items:center; gap:14px; }
.qc-ico{ font-size:44px; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
.qc-unit{ font-size:9px; color:#666; }
.qc-name{ font-size:22px; font-weight:700; color:#1f1f1f; margin:4px 0 2px; font-family:var(--f-read); }
.qc-zh{ font-size:13px; color:#4a4a4a; }
.qc-meta{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 14px; }
.tag{
  font-size:11px; padding:5px 9px; color:#fff;
  border:2px solid rgba(0,0,0,.35); text-shadow:1px 1px 0 rgba(0,0,0,.5);
}
.tag.new{ background:#3d8b40; } .tag.rev{ background:#8c4a2f; } .tag.time{ background:#4a5a8c; }

.stat-row{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px; max-width:720px; margin:16px auto 0;
}
.stat{ text-align:center; padding:12px 8px; }
.s-ico{ font-size:22px; }
.s-big{ font-size:15px; color:#1f1f1f; margin:6px 0 4px; }
.s-lab{ font-size:11px; color:#4a4a4a; }
.s-sub{ font-size:10px; color:#777; margin-top:3px; }

.goal-bar{ max-width:720px; margin:12px auto 0; text-align:left; }
.goal-bar .px{ color:#444; }
.home-nav{ margin:18px auto 0; max-width:720px; }

/* ============================ 📖 故事 ============================ */
.scene-banner{
  flex:0 0 auto;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 14px; margin-bottom:10px;
  background-image:var(--tex-plank); background-size:56px 56px;
  border:3px solid #6b4a25; box-shadow:0 0 0 3px #2e1e0e;
}
.sb-ico{ font-size:26px; }
.sb-en{ font-size:19px; font-weight:700; color:#fff8e0; text-shadow:2px 2px 0 #000; font-family:var(--f-read); }
.sb-zh{ font-size:13px; color:#ffe6a8; }

.story{ flex:1 1 auto; min-height:0; padding:4px 2px; }
.line{
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 12px; margin-bottom:8px;
  background:rgba(0,0,0,.42);
  border:2px solid rgba(255,255,255,.10);
  cursor:pointer; transition:background .15s, border-color .15s;
}
.line:hover{ background:rgba(0,0,0,.58); }
.line.active{ background:#2c3a22; border-color:var(--xp); box-shadow:0 0 0 2px rgba(127,252,32,.25); }
.line .sp{
  flex:0 0 auto; min-width:64px; padding-top:2px;
  font-size:11px; color:var(--gold); text-shadow:1px 1px 0 #000;
}
.line .bubble{ flex:1 1 auto; min-width:0; }
.line .en{ font-family:var(--f-read); font-size:19px; line-height:1.5; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.5); }
.line .zh{ margin-top:5px; font-size:13px; color:#a9c4a9; }
.line .spk{ flex:0 0 auto; font-size:17px; opacity:.5; }
.line.active .spk{ opacity:1; }

/* ============================ ⛏️ 挖新词 ============================ */
.mine-wrap{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns:minmax(240px,1fr) minmax(280px,1.3fr);
  gap:14px; align-content:start;
}
.ore-card{ text-align:center; padding:22px 16px; }
.ore-ico{ font-size:70px; line-height:1; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5)); }
.ore-word{
  margin:16px 0 8px; font-size:26px; color:var(--gold);
  text-shadow:3px 3px 0 #000; word-break:break-word;
}
.ore-pos{ font-size:15px; color:#d8d8d8; }
.ore-btns{ display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }

.ore-sent{ display:flex; flex-direction:column; justify-content:center; }
.os-label{ font-size:9px; color:#666; }
.os-en{
  font-family:var(--f-read); font-size:23px; line-height:1.6;
  color:#1c1c1c; margin:12px 0;
}
.os-en .hl{
  background:#ffe14d; padding:1px 5px;
  box-shadow:0 2px 0 #b99a00; color:#2b2200;
}
.os-zh{ font-size:14px; color:#555; margin-bottom:14px; }
.ore-sent .btn{ align-self:flex-start; }

/* ============================ 🎧 听音辨词 ============================ */
.listen-wrap{ flex:0 0 auto; text-align:center; padding:10px 0 16px; }
.speaker{
  width:104px; height:104px; font-size:44px;
  background:#3d6b8b; color:#fff;
  border:3px solid; border-color:#7fb0cd #1c3a4d #1c3a4d #7fb0cd;
  box-shadow:0 0 0 3px #000, 0 6px 0 rgba(0,0,0,.45);
  cursor:pointer;
}
.speaker:active{ transform:translateY(3px); box-shadow:0 0 0 3px #000, 0 3px 0 rgba(0,0,0,.45); }

.opts-4{
  flex:0 0 auto;
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  padding:4px 2px;
}
.opts-4.tight{ grid-template-columns:repeat(2,1fr); max-width:760px; margin:0 auto; width:100%; }
.big-opt{ text-align:center; padding:16px 8px; }
.o-ico{ font-size:40px; line-height:1.1; }
.o-zh{ margin-top:8px; font-size:15px; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.5); }
.word-opt{
  text-align:center; font-size:16px; color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.55); padding:20px 10px;
  word-break:break-word;
}

/* ============================ 📕 读句填词 ============================ */
.read-wrap{ flex:0 0 auto; text-align:center; padding:26px 18px; margin-bottom:6px; }
.rw-sent{ font-family:var(--f-read); font-size:27px; line-height:1.7; color:#1c1c1c; }
.rw-sent .blank{
  display:inline-block; min-width:110px;
  border-bottom:4px solid #c0392b; color:transparent;
}
.rw-sent .hl{ background:#ffe14d; padding:1px 5px; box-shadow:0 2px 0 #b99a00; }
.rw-zh{ margin-top:14px; font-size:14px; color:#666; }

/* ============================ 🗣️ 跟读 ============================ */
.speak-wrap{ flex:0 0 auto; text-align:center; padding:22px 18px; }
.sw-sp{ font-size:12px; color:#666; }
.sw-en{ font-family:var(--f-read); font-size:28px; line-height:1.6; color:#1a1a1a; margin:12px 0 8px; }
.sw-zh{ font-size:14px; color:#666; }
.sw-result{ margin-top:14px; min-height:24px; }
.swr-wait{ font-size:13px; color:#666; }
.swr-said{ font-size:15px; color:#222; }
.swr-score{ margin-top:6px; font-size:14px; font-weight:700; }
.swr-score.good{ color:#1e7d2e; } .swr-score.meh{ color:#b3432f; }
.btn.rec{ animation:pulse .9s infinite; }
@keyframes pulse{ 50%{ filter:brightness(1.5) } }

/* ============================ 🔨 拼写 ============================ */
.write-wrap{ flex:1 1 auto; display:flex; flex-direction:column; gap:14px; min-height:0; }
.ww-clue{ display:flex; align-items:center; gap:14px; }
.wc-ico{ font-size:42px; }
.wc-zh{ font-size:17px; font-weight:700; color:#1c1c1c; }
.wc-sent{ margin-top:6px; font-family:var(--f-read); font-size:17px; color:#3a3a3a; }
.wc-sent .blank{ display:inline-block; min-width:80px; border-bottom:3px solid #c0392b; color:transparent; }

.wslots{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.wslot{
  width:56px; height:64px; display:grid; place-items:center;

.summary{ flex:1; text-align:center; padding:10px 4px; }

}

<script>
/* ===== js/textures.js ===== */
/* ============================================================
   textures.js — 程序化生成 16×16 Minecraft 风格方块贴图
   零外部图片：全部用 canvas 画出来后转成 dataURL 注入 CSS 变量
   ============================================================ */
(function (global) {
  'use strict';

  // 固定种子的伪随机，保证每次打开贴图长得一样
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var PALETTES = {
    dirt:      ['#8b5f3c', '#7d5535', '#6f4b2e', '#966842', '#5f4127'],
    grass:     ['#7bb03a', '#6da033', '#84bb41', '#5f8f2c', '#8fc74a'],
    stone:     ['#7e7e7e', '#727272', '#8a8a8a', '#666666', '#949494'],
    deepslate: ['#4a4a50', '#41414a', '#535360', '#383840', '#5b5b68'],
    plank:     ['#b1834c', '#9d7342', '#c08f56', '#8b6437', '#a97c47'],
    sand:      ['#e0d3a3', '#d6c795', '#eaddb0', '#cbbb87', '#f0e5bd'],
    obsidian:  ['#17141f', '#1e1a2a', '#120f19', '#241f33', '#0e0c14'],
    emerald:   ['#17dd62', '#12b851', '#3ef283', '#0e9642', '#5cffa0']
  };

  function block(kind, seed) {
    var pal = PALETTES[kind] || PALETTES.stone;
    var c = document.createElement('canvas');
    c.width = c.height = 16;
    var g = c.getContext('2d');
    var rnd = mulberry32(seed || 1337);

    for (var y = 0; y < 16; y++) {
      for (var x = 0; x < 16; x++) {
        g.fillStyle = pal[(rnd() * pal.length) | 0];
        g.fillRect(x, y, 1, 1);
      }
    }

    // 草方块：顶部 4px 覆草，并往下滴几根草根
    if (kind === 'grass') {
      var d = mulberry32(99);
      for (var yy = 0; yy < 16; yy++) {
        for (var xx = 0; xx < 16; xx++) {
          if (yy > 3 + Math.floor(d() * 3)) {
            g.fillStyle = PALETTES.dirt[(d() * 5) | 0];
            g.fillRect(xx, yy, 1, 1);
          }
        }
      }
    }

    // 木板：横向纹理线
    if (kind === 'plank') {
      g.fillStyle = 'rgba(0,0,0,.35)';
      [0, 8].forEach(function (y0) { g.fillRect(0, y0, 16, 1); });
      g.fillStyle = 'rgba(255,255,255,.10)';
      [1, 9].forEach(function (y0) { g.fillRect(0, y0, 16, 1); });
    }

    return c.toDataURL('image/png');
  }

  var Textures = {
    build: function () {
      var root = document.documentElement;
      Object.keys(PALETTES).forEach(function (kind, i) {
        root.style.setProperty('--tex-' + kind, 'url(' + block(kind, 1000 + i * 77) + ')');
      });
    }
  };

  global.Textures = Textures;
})(window);

</script>

/* ============================================================
   audio.js — 发音 (Web Speech) + 音效 (WebAudio 合成，无外部音频文件)

(function (global) {
  'use strict';

  /* ---------------------- 预生成音频 ----------------------
     教材是封闭集合，所以整套词/句/对话都可以提前用神经 TTS 生成成 MP3。
     有现成文件就放文件，没有就退回系统语音 —— 两边可以共存，
     所以补内容的时候不会有一段突然哑掉。
     ------------------------------------------------------- */
  var Clips = {
    base: 'audio/',
    manifest: null,
    el: null,

    // 和 tools/gen-audio.js 里的 key() 必须是同一个算法，否则文件名对不上
    key: function (text) {
      var h = 0x811c9dc5, t = String(text).trim();
      for (var i = 0; i < t.length; i++) {
        h ^= t.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      return h.toString(36);
    },

    load: function () {
      var self = this;
      try {
        fetch(this.base + 'manifest.json', { cache: 'no-cache' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { self.manifest = j || {}; })
          .catch(function () { self.manifest = {}; });
      } catch (e) { this.manifest = {}; }
    },

    has: function (text) {
      return !!(this.manifest && this.manifest[this.key(text)]);
    },

    /** 放现成音频；返回 false 表示没有，让调用方退回系统语音 */
    play: function (text, opts) {
      if (!this.has(text)) return false;
      opts = opts || {};
      if (!this.el) this.el = new Audio();
      try {
        this.el.pause();
        this.el.src = this.base + this.key(text) + '.mp3';
        // 慢速按钮直接调播放速率，不用另外生成一套慢速音频（省一半钱和体积）
        this.el.playbackRate = opts.rate != null ? Math.max(0.5, Math.min(1.2, opts.rate + 0.1)) : 1;
        if ('preservesPitch' in this.el) this.el.preservesPitch = true;
        this.el.onended = opts.onend || null;
        var p = this.el.play();
        if (p && p.catch) p.catch(function () {});
        return true;
      } catch (e) { return false; }
    },

    stop: function () { try { if (this.el) this.el.pause(); } catch (e) {} }
  };

  /* ---------------------- 发音 TTS ---------------------- */
  var TTS = {
    voice: null,
    ready: false,
    muted: false,

    // 系统自带的玩具音效，绝不能拿来教孩子发音
    JUNK: /^(albert|bad news|bahh|bells|boing|bubbles|cellos|fred|good news|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|junior|princess|deranged|hysterical|bruce|agnes)/i,

    // 苹果第一代 compact 语音。能听懂，但就是「机器感」的来源
    LEGACY: /^(alex|daniel|fiona|karen|moira|rishi|samantha|tessa|victoria|veena)\b/i,

    /**
     * 给每个声音打分，挑最自然的那个。
     * 关键是先按「引擎新旧」排，再按口音排 —— 老引擎的英音远不如新引擎的美音好听。
     */
    score: function (v) {
      var n = v.name, s = 0;
      if (this.JUNK.test(n)) return -1000;
      if (/premium|enhanced|neural|natural|siri/i.test(n)) s += 100;   // 增强/神经网络语音
      if (this.LEGACY.test(n)) s -= 8;                                  // 苹果第一代 compact 引擎，机器味最重
      if (/^Google/i.test(n)) s += 60;                                  // Chrome 自带的云端语音
      if (/^Microsoft/i.test(n) && /online|natural/i.test(n)) s += 60;
      if (/en[-_]SG/i.test(v.lang)) s += 30;                            // 新加坡英语最贴他的学校
      else if (/en[-_]GB/i.test(v.lang)) s += 25;
      else if (/en[-_]AU/i.test(v.lang)) s += 12;
      else if (/en[-_]US/i.test(v.lang)) s += 8;
      else if (/^en/i.test(v.lang)) s += 3;
      else return -1000;
      if (!v.localService) s += 5;                                      // 云端的一般是新引擎
      return s;
    },

    /** 按分数排好的英语声音列表，设置页直接用它做试听菜单 */
    list: function () {
      var self = this;
      var vs = (global.speechSynthesis && speechSynthesis.getVoices()) || [];
      return vs.filter(function (v) { return self.score(v) > -1000; })
               .sort(function (a, b) { return self.score(b) - self.score(a); });
    },

    pick: function () {
      // 用户自己选过就尊重用户的选择，别每次刷新又被覆盖
      var saved = null;
      try { saved = localStorage.getItem('englishquest.voice'); } catch (e) {}
      var ranked = this.list();
      if (!ranked.length) return false;
      if (saved) {
        var hit = ranked.filter(function (v) { return v.name === saved; })[0];
        if (hit) { this.voice = hit; this.ready = true; return true; }
      }
      this.voice = ranked[0];
      this.ready = true;
      return true;
    },

    use: function (name) {
      var hit = this.list().filter(function (v) { return v.name === name; })[0];
      if (!hit) return false;
      this.voice = hit;
      try { localStorage.setItem('englishquest.voice', name); } catch (e) {}
      return true;
    },

    init: function () {
      Clips.load();
      if (!global.speechSynthesis) return;
      this.pick();
      speechSynthesis.onvoiceschanged = this.pick.bind(this);
    },

    // iPad Safari 要求首次朗读必须由用户手势触发，开场按钮里调一次这个解锁
    unlock: function () {
      if (!global.speechSynthesis) return;
      try {
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
      } catch (e) { /* noop */ }
      this.pick();
    },

    speak: function (text, opts) {
      if (this.muted || !text) return;
      opts = opts || {};
      // 优先放预生成的神经语音；没有这一段才退回系统语音
      try { speechSynthesis.cancel(); } catch (e) {}
      Clips.stop();
      if (Clips.play(text, opts)) return;
      if (!global.speechSynthesis) return;
      var u = new SpeechSynthesisUtterance(String(text));
      if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; }
      else { u.lang = 'en-GB'; }
      u.rate = opts.rate != null ? opts.rate : 0.9;
      u.pitch = opts.pitch != null ? opts.pitch : 1.0;   // 别改音高，老引擎一移调机器味更重
      u.volume = 1;
      if (opts.onend) u.onend = opts.onend;
      speechSynthesis.speak(u);
    },

    slow: function (text) { this.speak(text, { rate: 0.55 }); },

    // 逐句朗读一段对话
    speakSeq: function (lines, opts, done) {
      var i = 0, self = this;
      (function next() {
        if (i >= lines.length) { done && done(); return; }
        var line = lines[i++];
        opts && opts.onLine && opts.onLine(i - 1);
        self.speak(line, { rate: (opts && opts.rate) || 0.88, onend: function () { setTimeout(next, 320); } });
      })();
    },

    stop: function () { Clips.stop(); try { speechSynthesis.cancel(); } catch (e) {} }
  };

  /* ---------------------- 音效 SFX ---------------------- */
  var ctx = null;
  function ac() {
    if (!ctx) {
      var C = global.AudioContext || global.webkitAudioContext;
      if (C) ctx = new C();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type, vol, slideTo) {
    var a = ac(); if (!a || SFX.muted) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol == null ? 0.14 : vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }

  function noise(dur, vol) {
    var a = ac(); if (!a || SFX.muted) return;
    var n = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, n, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = a.createBufferSource(); s.buffer = buf;
    var g = a.createGain(); g.gain.value = vol == null ? 0.1 : vol;
    var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start();
  }

  var SFX = {
    muted: false,
    unlock: function () { ac(); },
    click:  function () { tone(520, 0.06, 'square', 0.10); },
    place:  function () { noise(0.10, 0.12); tone(180, 0.07, 'triangle', 0.08); },
    mine:   function () { noise(0.14, 0.14); },
    right:  function () { tone(660, 0.09, 'square', 0.11); setTimeout(function () { tone(880, 0.13, 'square', 0.11); }, 85); },
    wrong:  function () { tone(200, 0.18, 'sawtooth', 0.10, 110); },
    levelup:function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { tone(f, 0.16, 'square', 0.12); }, i * 95); }); },
    orb:    function () { tone(880, 0.07, 'sine', 0.08, 1320); },
    win:    function () { [392, 523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { tone(f, 0.22, 'triangle', 0.13); }, i * 130); }); }
  };

  global.Clips = Clips;
  global.TTS = TTS;
  global.SFX = SFX;
})(window);

</script>
<script>
/* ===== js/srs.js ===== */
/* ============================================================
   srs.js — 存档 + 艾宾浩斯间隔重复引擎
   四项技能（听 l / 读 r / 写 w / 说 s）各自独立计熟练度，
   一个词要四项都过关才算「掌握」，对应「听说读写」目标。
   ============================================================ */
(function (global) {
  'use strict';

  // 每个玩家一份独立存档。bufan 沿用原来的 key，老进度不会丢；
  // 访客写到 .guest，怎么点都碰不到 Bufan 的进度。
  var KEY_BASE = 'englishquest.save.v1';
  var PROFILES = {
    bufan: { name: 'Bufan', face: '👦', label: 'GAO BUFAN', locked: true, keeps: true },
    // 访客不留进度：关掉就没了，下次进来永远是全新的。
    // 这样别人怎么玩都不会在 localStorage 里留下东西。
    guest: { name: 'Guest', face: '🧍', label: 'GUEST', locked: false, keeps: false }
  };
  var PIN_KEY = 'englishquest.pin.v1';
  var DEFAULT_PIN = '1102';

  // 艾宾浩斯遗忘曲线 → 复习间隔（天）
  var INTERVAL = [0, 1, 2, 4, 7, 15, 30, 60, 120];
  var MAX_BOX = INTERVAL.length - 1;

  var SKILLS = ['l', 'r', 'w', 's'];   // listen / read / write / speak（四项都练、都显示）
  // 但「熟练掌握」只认读和写 —— 他听说本来就行，目标是 3000 词的读写。
  // 记忆盒的推进也只看这两项，否则很少练到的「说」会把盒子永远卡在低档。
  var CORE = ['r', 'w'];
  var SKILL_MAX = 3;
  var MASTER_BOX = 4;                  // 至少熬过 7 天那一档
  var MASTER_SKILL = 2;

  function todayIndex(d) {
    d = d || new Date();
    return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  }

  function blankSave(profile) {
    return {
      v: 1,
      profile: profile || 'bufan',
      name: (PROFILES[profile] || PROFILES.bufan).name,
      startDay: todayIndex(),
      goalDate: '2026-12-31',
      goalWords: 3000,
      minutes: 40,          // 每天想学多久，新词数由它自动推算
      xp: 0, gems: 0,
      streak: 0, bestStreak: 0,
      lastDay: null,
      daysDone: [],
      wordIndex: 0,         // 学到教材第几个词了（自适应要跨场景取词，所以精确到词）
      cards: {},                        // word -> card
      ach: [],
      stats: { answers: 0, correct: 0, seconds: 0, sessions: 0 }
    };
  }

  var Save = {
    PROFILES: PROFILES,
    profile: 'bufan',
    data: blankSave('bufan'),

    /** bufan 用原来的 key，老进度照旧能读到；其他玩家各自加后缀 */
    key: function () {
      return this.profile === 'bufan' ? KEY_BASE : KEY_BASE + '.' + this.profile;
    },

    keeps: function () { return (PROFILES[this.profile] || PROFILES.bufan).keeps !== false; },

    load: function (profile) {
      if (profile) this.profile = PROFILES[profile] ? profile : 'bufan';
      this.data = blankSave(this.profile);
      if (!this.keeps()) return this.data;      // 访客：永远从零开始，不读盘
      try {
        var raw = localStorage.getItem(this.key());
        if (raw) {
          var d = JSON.parse(raw);
          if (d && d.v === 1) {
            var base = blankSave(this.profile);
            // 先记下老存档「原本有没有」这个字段，再补默认值 ——
            // 顺序反了的话默认值会先把 wordIndex 填成 0，迁移就永远不触发
            var hadIndex = ('wordIndex' in d);
            for (var k in base) if (!(k in d)) d[k] = base[k];
            d.profile = this.profile;
            d.name = base.name;

            // 老存档没有 wordIndex，从已有卡片反推学到哪了（见 registry.resumeIndex）
            if (!hadIndex) d.wordIndex = global.EQ ? global.EQ.resumeIndex(d.cards) : 0;

            // 目标词数这类全局设定要跟着新版本走，不能被老存档冻住在 1000
            d.goalWords = base.goalWords;
            if (!d.minutes) d.minutes = base.minutes;
            delete d.cursor;
            this.data = d;
          }
        }
      } catch (e) { console.warn('存档读取失败，已重置', e); }
      return this.data;
    },

    save: function () {
      if (!this.keeps()) return;                // 访客：只活在内存里，不落盘
      try { localStorage.setItem(this.key(), JSON.stringify(this.data)); }
      catch (e) { console.warn('存档写入失败', e); }
    },

    reset: function () { this.data = blankSave(this.profile); this.save(); },

    exportText: function () { return JSON.stringify(this.data); },

    importText: function (txt) {
      var d = JSON.parse(txt);
      if (!d || d.v !== 1) throw new Error('存档格式不对');
      d.profile = this.profile;
      d.name = (PROFILES[this.profile] || PROFILES.bufan).name;
      this.data = d; this.save();
    },

    /* ---------------- 开场那道数字锁 ----------------
       只是前端的一道门闩：拦住随手乱点的人，别当成真的安全措施。
       密码存在本机，换设备要重新设。 */
    getPin: function () {
      try { return localStorage.getItem(PIN_KEY) || DEFAULT_PIN; }
      catch (e) { return DEFAULT_PIN; }
    },
    setPin: function (p) {
      try { localStorage.setItem(PIN_KEY, String(p)); } catch (e) {}
    }
  };

  var SRS = {
    INTERVAL: INTERVAL,
    SKILLS: SKILLS,
    SKILL_MAX: SKILL_MAX,
    today: todayIndex,

    card: function (word) {
      var c = Save.data.cards[word];
      if (!c) {
        c = { b: 0, due: todayIndex(), sk: { l: 0, r: 0, w: 0, s: 0 }, seen: 0, wrong: 0, first: todayIndex() };
        Save.data.cards[word] = c;
      }
      if (!c.sk) c.sk = { l: 0, r: 0, w: 0, s: 0 };
      return c;
    },

    isNew: function (word) { return !Save.data.cards[word]; },

    /**
     * 记一次作答结果
     * @param word  单词
     * @param skill 'l' | 'r' | 'w' | 's'，或者数组 —— 听写同时练「听+写」，朗读同时练「读+说」
     * @param good  是否答对
     */
    grade: function (word, skill, good) {
      var c = this.card(word);
      var day = todayIndex();
      var skills = (skill == null) ? [] : (Object.prototype.toString.call(skill) === '[object Array]' ? skill : [skill]);
      c.seen++;

      if (good) {
        skills.forEach(function (s) { if (c.sk[s] != null) c.sk[s] = Math.min(SKILL_MAX, c.sk[s] + 1); });
        // 只有当前最弱技能也跟上了，盒子才往前推 —— 防止靠单一技能刷过
        var weakest = this.weakest(c);
        if (c.sk[weakest] >= Math.min(SKILL_MAX, c.b === 0 ? 1 : Math.ceil(c.b / 2))) {
          c.b = Math.min(MAX_BOX, c.b + 1);
        }
        c.due = day + this.fuzz(INTERVAL[c.b]);
      } else {
        c.wrong++;
        skills.forEach(function (s) { if (c.sk[s] != null) c.sk[s] = Math.max(0, c.sk[s] - 1); });
        c.b = Math.max(0, c.b - 2);
        c.due = day;              // 当天重练
      }

      Save.data.stats.answers++;
      if (good) Save.data.stats.correct++;
      return c;
    },

    /**
     * 给间隔加 ±15% 的抖动。
     * 不加的话，同一天学的一批词会永远绑在一起到期 ——
     * 推演里能看到第 31/61/121 天突然冒出几百题的尖峰，孩子那天就崩了。
     */
    fuzz: function (days) {
      if (days < 4) return days;
      var d = Math.round(days * (Math.random() * 0.3 - 0.15));
      return Math.max(2, days + d);
    },

    /** 记忆盒推进看哪一项：只在读/写里挑最弱的 */
    weakest: function (c) {
      var best = CORE[0], v = 99;
      CORE.forEach(function (s) { if (c.sk[s] < v) { v = c.sk[s]; best = s; } });
      return best;
    },

    /** 出题时看四项里最弱的，听和说也要照顾到，只是不卡盒子 */
    weakestAll: function (c) {
      var best = 'l', v = 99;
      SKILLS.forEach(function (s) { if (c.sk[s] < v) { v = c.sk[s]; best = s; } });
      return best;
    },

    mastered: function (word) {
      var c = Save.data.cards[word];
      if (!c) return false;
      if (c.b < MASTER_BOX) return false;
      return CORE.every(function (s) { return c.sk[s] >= MASTER_SKILL; });
    },

    masteredCount: function () {
      var n = 0, self = this;
      Object.keys(Save.data.cards).forEach(function (w) { if (self.mastered(w)) n++; });
      return n;
    },

    learningCount: function () { return Object.keys(Save.data.cards).length; },

    /** 今天到期该复习的词（按最久没碰的排前面） */
    due: function (day) {
      day = day == null ? todayIndex() : day;
      var out = [];
      Object.keys(Save.data.cards).forEach(function (w) {
        var c = Save.data.cards[w];
        if (c.due <= day) out.push({ word: w, card: c, overdue: day - c.due });
      });
      // 积压时按「谁最接近毕业」排，而不是「谁最逾期」。
      // 推演里这一条把彻底塌方（掌握 0）变成稳定毕业（掌握 300+）：
      // 只救最逾期的会让所有词一起卡在低档，谁也毕不了业。
      out.sort(function (a, b) { return b.card.b - a.card.b || b.overdue - a.overdue; });
      return out;
    },

    /** 距离 12/31 目标的进度 */
    goal: function () {
      var d = Save.data;
      var end = new Date(d.goalDate + 'T23:59:59');
      var left = Math.max(0, Math.ceil((end - new Date()) / 86400000));
      var done = this.masteredCount();
      var met = this.learningCount();
      return {
        met: met,
        metPct: Math.min(100, Math.round(met / d.goalWords * 100)),
        done: done,
        total: d.goalWords,
        daysLeft: left,
        perDay: left > 0 ? Math.max(0, Math.ceil((d.goalWords - done) / left)) : 0,
        pct: Math.min(100, Math.round(done / d.goalWords * 100))
      };
    },

    /** 打卡：更新连续天数 */
    checkIn: function () {
      var d = Save.data, day = todayIndex();
      if (d.lastDay === day) return false;
      d.streak = (d.lastDay === day - 1) ? d.streak + 1 : 1;
      d.bestStreak = Math.max(d.bestStreak || 0, d.streak);
      d.lastDay = day;
      if (d.daysDone.indexOf(day) < 0) d.daysDone.push(day);
      d.stats.sessions++;
      Save.save();
      return true;
    }
  };

  /* ---------------------- 等级 / 经验 ---------------------- */
  var Level = {
    // 跟 MC 一样：越往后每级要的经验越多
    need: function (lv) { return 20 + lv * 8; },
    info: function (xp) {
      var lv = 0, rest = xp;
      while (rest >= this.need(lv)) { rest -= this.need(lv); lv++; }
      return { level: lv, into: rest, need: this.need(lv), pct: Math.round(rest / this.need(lv) * 100) };
    },
    add: function (n) {
      var before = this.info(Save.data.xp).level;
      Save.data.xp += n;
      var after = this.info(Save.data.xp).level;
      return after > before ? after : 0;   // 返回升到的新等级，没升级返回 0
    }
  };

  SRS.CORE = CORE;
  global.Save = Save;
  global.SRS = SRS;
  global.Level = Level;
})(window);

</script>
<script>
/* ===== js/data/registry.js ===== */
/* ============================================================
   registry.js — 教材注册表
   教学法：场景(scene) → 对话(story) → 句子(sentence) → 单词(word)

  var EQ = {
    units: [],
    _byId: {},
    _byWord: {},
    _flat: [],          // 全部单词，按教材顺序摊平

    addUnit: function (u) {
      var self = this;
      u.scenes.forEach(function (s, i) {

     * 不能用老的 {unit, scene} 光标 —— 场景重排过（6 个小场景合成 2 个大场景），

<script>
/* ===== js/game.js ===== */
/* ============================================================
   game.js — 每日关卡编排

   跟旧版最大的不同：**每天学多少新词不是写死的，是按时间预算算出来的**。
   复习队列空的时候多灌新词（开头几天能到 40 个），复习堆起来了自动少灌。
   写死 8 词/课会出现「前三天 10 分钟、一个月后 77 分钟」的失控曲线。
   ============================================================ */
(function (global) {
  'use strict';

  // 单题耗时估计（秒）。推演脚本直接读这里，保证模型和实现不会各说各话。
  var COST = {
    fixed:  60,     // 开场结算等固定开销
    story: 100,     // 每个场景的对话
    mine:    8,     // 新词卡
    listen: 10,     // 听音辨词
    spell:  20,     // 字母块拼写（界面里同时显示挖空的句子，所以记「读+写」）
    craft:  35,     // 词块造句
    speak:  15,     // 跟读
    dictate:14,     // 字母块听写（比打字快，用在还没毕业的词上）
    typein: 22      // 打字默写 —— 最贵的一关，也是最有效的一关
  };

  var PHASES = [
    { key: 'story',  ico: '📖', name: '场景故事' },
    { key: 'mine',   ico: '⛏️', name: '挖掘新词' },
    { key: 'listen', ico: '🎧', name: '听音辨词' },
    { key: 'write',  ico: '🔨', name: '铁砧拼写' },
    { key: 'craft',  ico: '🧰', name: '工作台造句' },
    { key: 'speak',  ico: '🗣️', name: '开口跟读' },
    { key: 'drill',  ico: '🎧', name: '听写复习' },
    { key: 'boss',   ico: '⌨️', name: '默写 Boss' },
    { key: 'done',   ico: '🏆', name: '结算领奖' }
  ];

  var MIN_NEW = 4, MAX_NEW = 40;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sample(arr, n, exclude) {
    var pool = arr.filter(function (x) { return !exclude || exclude.indexOf(x) < 0; });
    return shuffle(pool).slice(0, n);
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var Game = {
    PHASES: PHASES,
    COST: COST,
    session: null,

    // 一题练哪几项技能。拼写和默写界面里都带着挖空的句子，
    // 所以它们同时练「读 + 写」—— 这正是这次的目标技能。
    SKILL_OF: {
      listen: 'l', read: 'r', speak: 's',
      write: ['r', 'w'], typein: ['r', 'w'],
      dictate: ['l', 'w', 'r'], aloud: ['r', 's']
    },

    /** 出干扰项：优先同一章的词，长度接近的排前面 */
    distractors: function (target, n) {
      var pool = EQ.unlockedWords(Save.data.wordIndex).filter(function (w) { return w.w !== target.w; });
      if (pool.length < n) pool = EQ.all().filter(function (w) { return w.w !== target.w; });
      var same = pool.filter(function (w) { return w.unit === target.unit; });
      var use = same.length >= n ? same : pool;
      use = use.slice().sort(function (a, b) {
        var sa = (a.pos === target.pos ? 0 : 2) + Math.abs(a.w.length - target.w.length) * 0.3;
        var sb = (b.pos === target.pos ? 0 : 2) + Math.abs(b.w.length - target.w.length) * 0.3;
        return sa - sb;
      }).slice(0, Math.max(n + 4, 8));
      return sample(use, n);
    },

    task: function (type, word, scene) {
      var t = { t: type, word: word, skill: this.SKILL_OF[type] || null };
      if (type === 'listen' || type === 'read') {
        t.options = shuffle(this.distractors(word, 3).concat([word]));
      }
      if (type === 'speak' || type === 'aloud') t.line = this.lineFor(word, scene);
      return t;
    },

    /** 跟读用哪一句：优先用故事里含这个词的原句，没有就用词条例句 */
    lineFor: function (word, scene) {
      scene = scene || EQ.sceneById(word.scene);
      if (scene) {
        var re = new RegExp('\\b' + word.w + '(?:s|es|ed|ing|d)?\\b', 'i');
        var hit = scene.story.filter(function (l) { return re.test(l.en); })[0];
        if (hit) return hit;
      }
      return { sp: 'Say it', en: word.s, zh: word.sZh };
    },

    /**
     * 按时间预算算今天要学几个新词、复习几题。
     * 复习优先（SRS 的铁律），但最多吃掉 72% 的时间，
     * 否则到后期新词会被完全饿死，教材永远走不完。
     */
    /**
     * 复习分两关，按「离毕业还有多远」分流：
     *   盒子 ≥ 3 的老词  → ⌨️ 打字默写（22s，最严，最后一关）
     *   盒子 < 3 的新词  → 🎧 字母块听写（14s，更快，刚学两天的词不该逼他盲打）
     * 全部用打字的话吞吐量掉四成，年底熟练数从 ~1100 掉到 ~700。
     */
    splitDue: function (due) {
      var hard = [], easy = [];
      due.forEach(function (d) { (d.card.b >= 3 ? hard : easy).push(d); });
      return { hard: hard, easy: easy };
    },

    plan: function (minutes, due, reviewOnly) {
      var budget = Math.max(300, (minutes || 40) * 60 - COST.fixed);
      var split = this.splitDue(due || []);

      function fill(sec) {
        // 先排最接近毕业的（打字），再用剩下的时间排听写
        var typein = Math.min(split.hard.length, Math.floor(sec / COST.typein));
        var rest = sec - typein * COST.typein;
        var dictate = Math.min(split.easy.length, Math.floor(rest / COST.dictate));
        return { typein: typein, dictate: dictate };
      }

      if (reviewOnly) {
        var all = fill(budget);
        return { typein: all.typein, dictate: all.dictate, reviews: all.typein + all.dictate, newCount: 0 };
      }

      var r = fill(Math.floor(budget * 0.72));
      var used = r.typein * COST.typein + r.dictate * COST.dictate;
      var left = budget - used;
      var per = COST.mine + COST.spell + COST.story / 24;
      var newCount = clamp(Math.floor(left / per), MIN_NEW, MAX_NEW);
      return { typein: r.typein, dictate: r.dictate, reviews: r.typein + r.dictate, newCount: newCount };
    },

    /** 估算一节课要多久（分钟），主页上给家长看 */
    estimate: function (newCount, sceneCount, p) {
      var sec = COST.fixed + sceneCount * COST.story +
                newCount * (COST.mine + COST.spell) +
                Math.min(8, Math.ceil(newCount / 3)) * COST.listen +
                Math.min(4, Math.ceil(newCount / 6)) * COST.craft +
                Math.min(6, Math.ceil(newCount / 4)) * COST.speak +
                (p.typein || 0) * COST.typein + (p.dictate || 0) * COST.dictate;
      return Math.round(sec / 60);
    },

    /**
     * 组装今天这一节课
     * @param opts.reviewOnly 忙的时候只清复习，不开新场景
     */
    build: function (opts) {
      opts = opts || {};
      var self = this;
      var wi = Save.data.wordIndex || 0;

      var due = SRS.due().filter(function (d) { return EQ.word(d.word); });
      var p = this.plan(Save.data.minutes, due, opts.reviewOnly);

      var newWords = opts.reviewOnly ? [] : EQ.wordsFrom(wi, p.newCount);
      var scenes = EQ.scenesOf(newWords);
      var newSet = newWords.map(function (w) { return w.w; });
      var pool = due.filter(function (d) { return newSet.indexOf(d.word) < 0; });
      var split = this.splitDue(pool);
      var hardItems = split.hard.slice(0, p.typein);
      var easyItems = split.easy.slice(0, p.dictate);

      var queue = [];
      var phase = function (key, items) {
        items.forEach(function (it) { it.phase = key; queue.push(it); });
      };

      if (scenes.length) {
        phase('story', scenes.map(function (s) { return { t: 'story', scene: s }; }));
      }
      if (newWords.length) {
        phase('mine', newWords.map(function (w) { return { t: 'mine', word: w }; }));
        // 听：抽一部分做支撑，不进主路径（他听说本来就行）
        phase('listen', sample(newWords, Math.min(8, Math.ceil(newWords.length / 3)))
          .map(function (w) { return self.task('listen', w); }));
        // 写：全部新词都要拼一遍，这是主目标技能
        phase('write', shuffle(newWords).map(function (w) { return self.task('write', w); }));
        phase('craft', sample(newWords, Math.min(4, Math.ceil(newWords.length / 6)))
          .map(function (w) { return { t: 'craft', word: w, sentence: w.s, sentenceZh: w.sZh, skill: ['r'] }; }));
        phase('speak', sample(newWords, Math.min(6, Math.ceil(newWords.length / 4)))
          .map(function (w) { return self.task('speak', w); }));
      }

      // 倒数第二关：字母块听写，给还没毕业的词
      phase('drill', easyItems.map(function (d) {
        var t = self.task('dictate', EQ.word(d.word)); t.review = true; return t;
      }));

      // 最后一关：打字默写，不给选项，给最接近毕业的词
      var bossItems = hardItems.map(function (d) {
        var t = self.task('typein', EQ.word(d.word)); t.review = true; return t;
      });
      if (!bossItems.length && newWords.length) {
        bossItems = sample(newWords, Math.min(8, newWords.length)).map(function (w) {
          var t = self.task('typein', w); t.review = true; return t;
        });
      }
      phase('boss', bossItems);
      phase('done', [{ t: 'done' }]);

      this.session = {
        scenes: scenes,
        scene: scenes[0] || null,
        startIndex: wi,
        newWords: newWords,
        queue: queue,
        i: 0,
        startedAt: Date.now(),
        xpGained: 0, gemsGained: 0,
        right: 0, wrong: 0,
        wrongWords: [],
        relearn: [],
        newCount: newWords.length,
        reviewCount: bossItems.length + easyItems.length,
        typeinCount: bossItems.length,
        estimate: this.estimate(newWords.length, scenes.length, { typein: bossItems.length, dictate: easyItems.length })
      };
      return this.session;
    },

    current: function () {
      var s = this.session;
      if (!s) return null;
      return s.queue[s.i] || null;
    },

    answer: function (good, task) {
      var s = this.session;
      task = task || this.current();
      if (!task) return;

      if (task.word && task.skill) SRS.grade(task.word.w, task.skill, good);
      s.combo = good ? (s.combo || 0) + 1 : 0;
      s.bestCombo = Math.max(s.bestCombo || 0, s.combo);

      if (good) {
        s.right++;
        var xp = task.review ? 3 : 2;
        s.xpGained += xp;
        var up = Level.add(xp);
        SFX.orb();
        if (up) { SFX.levelup(); UI.toast('⭐', '等级提升！', 'Level ' + up); }
      } else {
        s.wrong++;
        SFX.wrong();
        if (task.word && s.wrongWords.indexOf(task.word.w) < 0) s.wrongWords.push(task.word.w);
        if (task.word && !task.isRelearn && s.relearn.length < 12) {
          var again = this.task(task.t, task.word);
          again.phase = 'boss'; again.isRelearn = true; again.review = true;
          s.relearn.push(again);
        }
      }
      Save.save();
    },

    next: function () {
      var s = this.session;
      s.i++;
      var cur = s.queue[s.i];
      if (cur && cur.t === 'done' && s.relearn.length) {
        var extra = s.relearn.splice(0, s.relearn.length);
        for (var k = 0; k < extra.length; k++) s.queue.splice(s.i + k, 0, extra[k]);
      }
      return this.current();
    },

    progress: function () {
      var s = this.session;
      return { i: s.i, n: s.queue.length, pct: Math.round(s.i / s.queue.length * 100) };
    },

    phaseState: function () {
      var s = this.session, cur = this.current();
      var curKey = cur ? cur.phase || cur.t : 'done';
      var seen = {};
      s.queue.slice(0, s.i).forEach(function (t) { seen[t.phase || t.t] = true; });
      return PHASES.map(function (p) {
        return { ico: p.ico, name: p.name, now: p.key === curKey, done: !!seen[p.key] && p.key !== curKey };
      });
    },

    finish: function () {
      var s = this.session;
      var mins = Math.round((Date.now() - s.startedAt) / 60000);
      Save.data.stats.seconds += Math.round((Date.now() - s.startedAt) / 1000);

      var acc = s.right + s.wrong ? Math.round(s.right / (s.right + s.wrong) * 100) : 0;
      var gems = Math.max(1, Math.round(s.newCount * 0.5 + s.right * 0.1 + (acc >= 90 ? 3 : 0)));
      Save.data.gems += gems;
      s.gemsGained = gems;
      s.minutes = mins;
      s.accuracy = acc;

      var freshDay = SRS.checkIn();
      // 学过的新词才推进光标
      if (s.newCount) Save.data.wordIndex = s.startIndex + s.newCount;
      Save.save();
      s.freshDay = freshDay;
      return s;
    }
  };

  Game.shuffle = shuffle;
  Game.sample = sample;
  global.Game = Game;
})(window);

</script>
<script>
/* ===== js/views.js ===== */
/* ============================================================
   views.js — 所有界面与关卡玩法
   ============================================================ */
(function (global) {
  'use strict';

  var stage = null;
  var showZh = false;          // 故事里的中文默认藏起来，点一下才看
  var recog = null;            // 语音识别（有就用，没有就自评）

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /** 把句子里的目标词高亮出来（词形可能带 s/ing/ed） */
  function highlight(sentence, word) {
    var re = new RegExp('\\b(' + word + '(?:s|es|ed|ing|d)?)\\b', 'i');
    return esc(sentence).replace(re, function (m) { return '<b class="hl">' + m + '</b>'; });
  }

  /** 把句子里的目标词挖空 */
  function blank(sentence, word) {
    var re = new RegExp('\\b' + word + '(?:s|es|ed|ing|d)?\\b', 'i');
    if (!re.test(sentence)) return esc(sentence) + ' <span class="blank">______</span>';
    return esc(sentence).replace(re, '<span class="blank">______</span>');
  }

  var UI = {

    mount: function (el) { stage = el; },

    /* ------------------------------------------------------------------
       通用：成就 / 提示条
       ------------------------------------------------------------------ */
    toast: function (ico, title, body) {
      var box = document.getElementById('toasts');
      var d = document.createElement('div');
      d.className = 'toast';
      d.innerHTML = '<div class="ico">' + ico + '</div><div><div class="tt px">' + esc(title) +
                    '</div><div class="tb">' + esc(body) + '</div></div>';
      box.appendChild(d);

    /** 用浏览器语音识别给跟读打分；不支持或失败就退回自评 */
    listenToChild: function (target, task, btn) {
      var R = global.SpeechRecognition || global.webkitSpeechRecognition;
      var out = document.getElementById('swr');
      if (!R) return;
      try { TTS.stop(); if (recog) recog.abort(); } catch (e) {}
      recog = new R();
      recog.lang = 'en-GB';
      recog.interimResults = false;
      recog.maxAlternatives = 3;
      btn.textContent = '🎙️ 听你说...'; btn.classList.add('rec');
      out.innerHTML = '<div class="swr-wait">请对着麦克风读出上面的句子</div>';

      var norm = function (s) { return s.toLowerCase().replace(/[^a-z\s']/g, ' ').split(/\s+/).filter(Boolean); };
      var want = norm(target);

      recog.onresult = function (e) {
        var best = 0, said = '';
        for (var i = 0; i < e.results[0].length; i++) {
          var txt = e.results[0][i].transcript;
          var got = norm(txt);
          var hit = want.filter(function (x) { return got.indexOf(x) >= 0; }).length / want.length;
          if (hit > best) { best = hit; said = txt; }
        }
        var good = best >= 0.6;
        out.innerHTML = '<div class="swr-said">你说的：<b>' + esc(said) + '</b></div>' +
          '<div class="swr-score ' + (good ? 'good' : 'meh') + '">命中 ' + Math.round(best * 100) + '%' +
          (good ? ' — 很棒！' : ' — 再读一遍试试') + '</div>';
        if (good) { SFX.right(); Game.answer(true, task); setTimeout(function () { App.advance(); }, 1100); }
        else { SFX.wrong(); }
        btn.textContent = '🎤 我来读'; btn.classList.remove('rec');
      };
      recog.onerror = function () {
        out.innerHTML = '<div class="swr-wait">麦克风用不了，用下面的按钮自己判断就行 👇</div>';
        btn.textContent = '🎤 我来读'; btn.classList.remove('rec');
      };
      recog.onend = function () { btn.textContent = '🎤 我来读'; btn.classList.remove('rec'); };
      try { recog.start(); } catch (e) { recog.onerror(); }
    },

    /* ---------------------------- 🔨 铁砧拼写 / 🎧 听写 ----------------------------
       两关共用一套字母块界面，区别只在给不给提示线索：
         write   —— 看着中文和挖空的句子拼（新词第一次练「写」）
         dictate —— 只给声音，什么都不看就拼（复习用，一题同时练「听 + 写」）
       ------------------------------------------------------------------------- */
    vWrite: function (t) { this.spell(t, false); },
    vDictate: function (t) { this.spell(t, true); },

    spell: function (t, blind) {
      var w = t.word;
      var target = w.w.toLowerCase();
      var letters = target.split('');
      var extra = 'abcdefghijklmnopqrstuvwxyz'.split('');
      var pool = Game.shuffle(letters.concat(Game.sample(extra, Math.min(4, Math.max(2, 8 - letters.length)))));
      var filled = [];        // 已经敲进空格的字母
      var usedTiles = [];     // 对应用掉的字母块下标，退格时按栈弹出
      var revealed = 0;       // 用过几次提示

      function isUsedTile(i) { return usedTiles.indexOf(i) >= 0; }

      function paint() {
        stage.querySelector('.wslots').innerHTML = target.split('').map(function (ch, i) {
          var v = filled[i];
          return '<div class="wslot' + (v ? ' has' : '') + (i < revealed ? ' hint' : '') + '" data-i="' + i + '">' +
                 esc(v || '') + '</div>';
        }).join('');
        stage.querySelector('.wtiles').innerHTML = pool.map(function (ch, i) {
          return '<div class="tile' + (isUsedTile(i) ? ' used' : '') + '" data-t="' + i + '">' + esc(ch) + '</div>';
        }).join('');
        bind();
      }

      /** 提示：把前 n 个字母直接摆好，并把对应的字母块标记为已用 */
      function fillPrefix(n) {
        filled = target.slice(0, n).split('');
        usedTiles = [];
        filled.forEach(function (ch) {
          for (var i = 0; i < pool.length; i++) {
            if (pool[i] === ch && usedTiles.indexOf(i) < 0) { usedTiles.push(i); return; }
          }
        });
      }

      stage.innerHTML =
        (blind ? this.head('🎧', '听写 Dictation', '只靠耳朵，把这个词拼出来 · 一题练「听 + 写」')
               : this.head('🔨', '铁砧拼写', '把字母敲成这个词')) +
        '<div class="write-wrap">' +
          (blind
            ? '<div class="dict-clue">' +
                '<button class="speaker" data-a="say">🔊</button>' +
                '<div class="row center" style="margin-top:10px">' +
                  '<button class="btn sm ghost" data-a="slow">🐢 慢一点</button>' +
                '</div>' +
              '</div>'
            : '<div class="ww-clue panel">' +
                '<span class="wc-ico">' + w.ico + '</span>' +
                '<div class="grow"><div class="wc-zh">' + esc(w.zh) + '（' + esc(w.pos) + '）</div>' +
                '<div class="wc-sent">' + blank(w.s, w.w) + '</div></div>' +
                '<button class="btn sm" data-a="say">🔊</button>' +
              '</div>') +
          '<div class="wslots"></div>' +
          '<div class="wtiles"></div>' +
          '<div class="t-foot">' +
            '<button class="btn ghost sm" data-a="hint">💡 提示一个字母</button>' +
            '<button class="btn ghost sm" data-a="clear">↩️ 清空</button>' +
            '<span class="grow"></span>' +
          '</div>' +
        '</div>' +
        '<div id="foot"></div>';

      var answered = false;
      function bind() {
        stage.querySelectorAll('.tile').forEach(function (el) {
          el.onclick = function () {
            if (answered || isUsedTile(+el.dataset.t)) return;
            if (filled.length >= target.length) return;
            filled.push(pool[+el.dataset.t]);
            usedTiles.push(+el.dataset.t);
            SFX.place();
            paint();
            if (filled.length === target.length) check();
          };
        });
        stage.querySelectorAll('.wslot').forEach(function (el) {
          el.onclick = function () {
            if (answered || filled.length <= revealed) return;   // 提示给的字母不许退掉
            filled.pop(); usedTiles.pop(); SFX.click(); paint();
          };
        });
      }

      function check() {
        answered = true;
        var good = filled.join('') === target;
        stage.querySelectorAll('.wslot').forEach(function (el, i) {
          el.classList.add(filled[i] === target[i] ? 'ok' : 'bad');
        });
        setTimeout(function () {
          UI.feedback(good, w, blind ? 'dictate' : 'write',
            good && revealed ? '用了 ' + revealed + ' 次提示，下次试试不用 💡' : null);
        }, 250);
      }

      stage.querySelector('[data-a="say"]').onclick = function () {
        TTS.speak(blind ? w.w : w.s, { rate: blind ? 0.75 : 0.85 });
      };
      var slowBtn = stage.querySelector('[data-a="slow"]');
      if (slowBtn) slowBtn.onclick = function () { TTS.slow(w.w); };
      stage.querySelector('[data-a="hint"]').onclick = function () {
        if (answered || revealed >= target.length - 1) return;
        revealed++; SFX.click();
        fillPrefix(revealed);
        paint();
        if (filled.length === target.length) check();
      };
      stage.querySelector('[data-a="clear"]').onclick = function () {
        if (answered) return;
        fillPrefix(revealed); paint();
      };
      paint();
      setTimeout(function () { TTS.speak(w.w, { rate: 0.75 }); }, 300);
    },


    /* ---------------------------- ⌨️ 默写 Boss ----------------------------
       最后一关不给选项，自己用键盘把词打出来。
       比点选难得多，也是唯一能真正验证「会写」的题型。
       ------------------------------------------------------------------- */
    vTypein: function (t) {
      var w = t.word;
      var answered = false;
      var heard = false;

      stage.innerHTML =
        this.head('⌨️', '默写 Boss', '不给选项了 —— 自己把这个词打出来') +
        '<div class="typein-wrap panel">' +
          '<div class="ti-top">' +
            '<span class="ti-ico">' + w.ico + '</span>' +
            '<span class="ti-zh">' + esc(w.zh) + '<i>（' + esc(w.pos) + '）</i></span>' +
          '</div>' +
          '<div class="ti-sent">' + blank(w.s, w.w) + '</div>' +
          '<div class="ti-sentzh">' + esc(w.sZh) + '</div>' +
          // 关掉 iOS 的自动大写/自动纠错/联想 —— 不关的话系统会替他把拼写改对，这一关就白做了
          '<input id="tin" class="ti-input" type="text" ' +
            'autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" ' +
            'inputmode="text" enterkeyhint="done" placeholder="在这里打出这个词">' +
          '<div class="ti-msg" id="timsg"></div>' +
        '</div>' +
        '<div class="t-foot">' +
          '<button class="btn ghost sm" data-a="hear">🔊 听一下（算用了提示）</button>' +
          '<span class="grow"></span>' +
          '<button class="btn primary" data-a="go">交卷 ✓</button>' +
        '</div>' +
        '<div id="foot"></div>';

      var input = document.getElementById('tin');
      var msg = document.getElementById('timsg');
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 260);

      function check() {
        if (answered) return;
        var got = (input.value || '').trim().toLowerCase();
        if (!got) { msg.textContent = '先打点什么再交卷'; return; }
        answered = true;
        var want = w.w.toLowerCase();
        var good = got === want;
        input.classList.add(good ? 'ok' : 'bad');
        input.blur();
        if (!good) {
          msg.innerHTML = '正确拼写是 <b>' + esc(w.w) + '</b>' +
            (got.length ? '，你打的是 <s>' + esc(got) + '</s>' : '');
        } else if (heard) {
          msg.textContent = '对了，不过用了发音提示，下次试试直接写';
        }
        stage.querySelector('.ti-sent').innerHTML = highlight(w.s, w.w);
        UI.feedback(good, w, 'typein', good && heard ? '用了发音提示 🔊' : null);
      }

      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      stage.querySelector('[data-a="go"]').onclick = check;
      stage.querySelector('[data-a="hear"]').onclick = function () {
        heard = true; TTS.speak(w.w, { rate: 0.75 });
      };
    },

    /* ---------------------------- 🧰 工作台造句 ---------------------------- */
    vCraft: function (t) {
      var parts = t.sentence.replace(/([.!?,])/g, ' $1').split(/\s+/).filter(Boolean);
      var pool = Game.shuffle(parts.map(function (p, i) { return { p: p, i: i }; }));
      var built = [];
      var answered = false;

      stage.innerHTML =
        this.head('🧰', '工作台造句', '把词块按正确顺序摆好') +
        '<div class="craft-wrap">' +
          '<div class="cw-goal panel"><span class="cg-lab px">要说的意思</span>' +
            '<span class="cg-zh">' + esc(t.sentenceZh) + '</span>' +
            '<button class="btn sm ghost" data-a="hear">🔊 听一遍</button></div>' +
          '<div class="cw-line" id="built"></div>' +
          '<div class="cw-pool" id="pool"></div>' +
        '</div>' +
        '<div class="t-foot">' +
          '<button class="btn ghost sm" data-a="undo">↩️ 退一个</button>' +
          '<span class="grow"></span>' +
          '<button class="btn primary" data-a="check" disabled>🔨 合成！</button>' +
        '</div><div id="foot"></div>';

      function paint() {
        document.getElementById('built').innerHTML = built.map(function (b, i) {
          return '<div class="wblock" data-b="' + i + '">' + esc(b.p) + '</div>';
        }).join('') || '<div class="cw-empty">点下面的词块，一个一个摆上来</div>';
        document.getElementById('pool').innerHTML = pool.map(function (b, i) {
          var used = built.some(function (x) { return x.i === b.i; });
          return '<div class="wblock pool' + (used ? ' used' : '') + '" data-p="' + i + '">' + esc(b.p) + '</div>';
        }).join('');
        stage.querySelector('[data-a="check"]').disabled = built.length !== parts.length;
        bind();
      }
      function bind() {
        stage.querySelectorAll('.wblock.pool').forEach(function (el) {
          el.onclick = function () {
            if (answered || el.classList.contains('used')) return;
            built.push(pool[+el.dataset.p]); SFX.place(); paint();
          };
        });
        stage.querySelectorAll('#built .wblock').forEach(function (el) {
          el.onclick = function () { if (answered) return; built.splice(+el.dataset.b, 1); SFX.click(); paint(); };
        });
      }

      stage.querySelector('[data-a="undo"]').onclick = function () { if (!answered && built.length) { built.pop(); paint(); } };
      stage.querySelector('[data-a="hear"]').onclick = function () { TTS.speak(t.sentence, { rate: 0.85 }); };
      stage.querySelector('[data-a="check"]').onclick = function () {
        if (answered) return; answered = true;
        var got = built.map(function (b) { return b.p; }).join(' ');
        var want = parts.join(' ');
        var good = got === want;
        document.getElementById('built').querySelectorAll('.wblock').forEach(function (el, i) {
          el.classList.add(built[i].p === parts[i] ? 'ok' : 'bad');
        });
        if (!good) {
          document.getElementById('built').insertAdjacentHTML('afterend',
            '<div class="cw-answer">正确答案：<b>' + esc(t.sentence) + '</b></div>');
        }
        UI.feedback(good, t.word, 'read');
      };
      paint();
    },

    /* ---------------------------- 判定反馈条 ---------------------------- */
    feedback: function (good, word, kind, note) {
      var task = Game.current();
      Game.answer(good, task);
      if (good) SFX.right();

      var foot = document.getElementById('foot') || stage.querySelector('.t-foot');
      var html =
        '<div class="fb ' + (good ? 'good' : 'bad') + '">' +
          '<div class="fb-ico">' + (good ? '✅' : '❌') + '</div>' +
          '<div class="grow">' +
            '<div class="fb-t px">' + (good ? 'Nice!  答对了' : 'Oops!  再记一次') + '</div>' +
            (word ? '<div class="fb-w"><b>' + esc(word.w) + '</b> ' + esc(word.zh) +
                    ' — <span class="fb-s">' + esc(word.s) + '</span></div>' : '') +
            (note ? '<div class="fb-n">' + esc(note) + '</div>' : '') +
          '</div>' +
          (word ? '<button class="btn sm ghost" data-a="say">🔊</button>' : '') +
          '<button class="btn primary" data-a="next">继续 →</button>' +
        '</div>';

      if (foot) { foot.innerHTML = html; foot.className = 't-foot'; }
      else { stage.insertAdjacentHTML('beforeend', html); }

      var sayBtn = stage.querySelector('[data-a="say"]');
      if (sayBtn) sayBtn.onclick = function () { TTS.speak(word.s, { rate: 0.85 }); };

      var moved = false;
      var go = function () { if (moved) return; moved = true; App.advance(); };
      stage.querySelector('[data-a="next"]').onclick = go;

      // 不管对错都把整句再读一遍，这是最值钱的一次重复输入
      var spoke = false;
      if (word && !TTS.muted) {
        spoke = true;
        TTS.speak(word.s, { rate: 0.85, onend: good ? function () { setTimeout(go, 400); } : null });
      }
      // 答对就自动往下走，孩子不用一节课点五十次「继续」；
      // 答错才停下来等他自己点 —— 那一下停顿是要他重新看一遍这个词。
      if (good) setTimeout(go, spoke ? 3200 : 900);   // 语音没回调时的兜底
    },

       🗺️ 章节地图
       ================================================================== */
    map: function () {

          var lo = s.words[0].idx, hi = s.words[s.words.length - 1].idx;

            '<span class="ms-z">' + esc(s.titleZh) + '</span>' +

    /* ==================================================================
       📊 成长报告
       ================================================================== */
    stats: function () {
      App.setHudMode('home');
      var d = Save.data, g = SRS.goal();
      var acc = d.stats.answers ? Math.round(d.stats.correct / d.stats.answers * 100) : 0;
      var byBox = [0, 0, 0, 0, 0, 0, 0, 0, 0];
      Object.keys(d.cards).forEach(function (k) { byBox[d.cards[k].b]++; });

      // 最近 28 天打卡格

      for (var i = 27; i >= 0; i--) {

      }

        this.head('📊', '成长报告', '给爸爸妈妈看的') +
        '<div class="scroll" style="flex:1">' +
          '<div class="stat-row">' +
            sc('💎', g.done + '/' + g.total, '已掌握（听说读写全过）') +
            sc('📚', SRS.learningCount(), '正在学的词') +
            sc('🎯', acc + '%', '历史正确率') +
            sc('⏱', Math.round(d.stats.seconds / 60) + ' 分', '累计学习时长') +
            sc('🔥', d.streak + ' 天', '当前连续打卡') +
            sc('📅', g.daysLeft + ' 天', '距 12/31 · 每天需 ' + g.perDay + ' 词') +
          '</div>' +
          '<div class="panel" style="margin-top:14px">' +
            '<div class="px tiny">最近 28 天打卡</div>' +
            '<div class="cal">' + cal.join('') + '</div>' +
          '</div>' +
          '<div class="panel" style="margin-top:12px">' +
            '<div class="px tiny">记忆盒分布（越靠右说明记得越牢）</div>' +
            '<div class="boxes">' + byBox.map(function (n, i) {
              return '<div class="bx"><i style="height:' + Math.round(n / maxBox * 70 + 4) + 'px"></i>' +
                     '<span>' + (SRS.INTERVAL[i] || 0) + 'd</span><em>' + n + '</em></div>';
            }).join('') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="t-foot"><button class="btn ghost" data-a="back">← 回主页</button></div>';
      stage.querySelector('[data-a="back"]').onclick = function () { SFX.click(); UI.home(); };

      function sc(i, b, l) {
        return '<div class="stat panel"><div class="s-ico">' + i + '</div>' +
               '<div class="s-big px">' + b + '</div><div class="s-lab">' + l + '</div></div>';
